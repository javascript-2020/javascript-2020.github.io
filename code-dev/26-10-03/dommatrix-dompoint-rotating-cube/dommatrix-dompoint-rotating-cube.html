


      <body></body>
      <style>html{height:1000px}body{height:calc(100% - 16px);display:grid}</style>
      
      <script>
      
      
        var body    = document.body;
        
        var size    = 10;
        
        var gridw   = Math.floor(window.innerWidth/size);
        //var gridh   = Math.floor(window.innerHeight/size);
        var gridh   = Math.floor(document.documentElement.scrollHeight/size);
        
        var cx      = Math.floor(gridw/2);
        var cy      = Math.floor(gridh/2);
        
        body.style.cssText    = `
                                      grid-template-columns:repeat(${gridw},1fr);
                                      grid-template-rows:repeat(${gridh},1fr)
                                `;
                                
        var div     = document.createElement('div');
        var list    = [];
        var draw    = [];
        
        for(var i=0;i<gridw*gridh;i++){
        
              var ndiv   = div.cloneNode();
              list.push(ndiv);
              body.append(ndiv);
              
        }//for
        
        var cube    = [
              new DOMPoint(0,0,0),
              new DOMPoint(1,0,0),
              new DOMPoint(1,1,0),
              new DOMPoint(0,1,0),
              
              new DOMPoint(0,0,1),
              new DOMPoint(1,0,1),
              new DOMPoint(1,1,1),
              new DOMPoint(0,1,1),
        ];
        
        var edges   = [
              [0,1],
              [1,2],
              [2,3],
              [3,0],
              
              [4,5],
              [5,6],
              [6,7],
              [7,4],
              
              [0,4],
              [1,5],
              [2,6],
              [3,7]
        ];
        
        
        var a   = 0;
        var b   = 0;
        var c   = 0;
        var n   = 200;
        update();
        
        
  //:
  
  
        function update(){
        
              clear();
              
              a++;
              b+=2;
              
              var css     = `
                                  translate(50px,50px)
                                  rotateZ(${a}deg)
                                  rotateY(${b}deg)
                                  translate3d(-10px,-10px,-10px)
                                  scale3d(20,20,20)
                            `;
              var matrix  = new DOMMatrix(css);
              
              for(var i=0;i<edges.length;i++){
              
                    var edge    = edges[i];
                    
                    var i1      = edge[0];
                    var i2      = edge[1];
                    
                    var pt1     = cube[i1].matrixTransform(matrix);
                    var pt2     = cube[i2].matrixTransform(matrix);
                    
                    line(pt1.x,pt1.y,pt2.x,pt2.y);
                    
              }//for
              
              c++;
                                                                                //console.log('update',c);
              if(c==n)return;
              
              requestAnimationFrame(update);
              
        }//update
        
        
        function clear(){draw.forEach(({x,y})=>list[y*gridw+x].style.background='');draw.length=0}
        
        
        function plot(x,y,c){
        
              x   = Math.floor(x);
              y   = Math.floor(y);
              draw.push({x,y});
              var index   = y*gridw+x;
              var list    = body.querySelectorAll('div');
              list[index].style.background    = `rgba(0,0,255,${c})`;
              
        }//plot
        
        
        function ipart(x){return Math.floor(x)}
        function round(x){return ipart(x+0.5)}
        function fpart(x){return x-ipart(x)}
        function rfpart(x){return 1-fpart(x)}
        
        
        function line(x0,y0,x1,y1){
        
              var steep   = (Math.abs(y1-y0)>Math.abs(x1-x0));
              var t;
              
              if(steep){
                    t       = y0;
                    y0      = x0;
                    x0      = t;
                    t       = y1;
                    y1      = x1;
                    x1      = t;
              }
              if(x0>x1){
                    t       = x0;
                    x0      = x1;
                    x1      = t;
                    t       = y0;
                    y0      = y1;
                    y1      = t;
              }
              
              
              var dx    = x1-x0;
              var dy    = y1-y0;
              
              
              var gradient;
              if(dx==0){
                    gradient    = 1.0;
              }else{
                    gradient    = dy/dx;
              }
              
                                                                      // first endpoint
              var xend      = round(x0);
              var yend      = y0+gradient*(xend-x0);
              var xgap      = rfpart(x0+0.5);
                                                                      // this will be used in the main loop
              var xpxl1     = xend;
              var ypxl1     = ipart(yend);
              
              if(steep){
                    plot(ypxl1,xpxl1,rfpart(yend)*xgap);
                    plot(ypxl1+1,xpxl1,fpart(yend)*xgap);
              }else{
                    plot(xpxl1,ypxl1,rfpart(yend)*xgap);
                    plot(xpxl1,ypxl1+1,fpart(yend)*xgap);
              }
              
                                                                      // first y-intersection for the main loop
              var intery    = yend+gradient;
              
                                                                      // second endpoint
              var xend      = round(x1);
              var yend      = y1+gradient*(xend-x1);
              var xgap      = fpart(x1+0.5);
                                                                      // this will be used in the main loop
              var xpxl2     = xend;
              var ypxl2     = ipart(yend);
              
              if(steep){
                    plot(ypxl2,xpxl2,rfpart(yend)*xgap);
                    plot(ypxl2+1,xpxl2,fpart(yend)*xgap);
              }else{
                    plot(xpxl2,ypxl2,rfpart(yend)*xgap);
                    plot(xpxl2,ypxl2+1,fpart(yend)*xgap);
              }
                                                                      // main loop
              if(steep){
                    for(var x=xpxl1+1;x<=xpxl2-1;x++){
                    
                          plot(ipart(intery),x,rfpart(intery));
                          plot(ipart(intery)+1,x,fpart(intery));
                          intery    = intery+gradient;
                          
                    }//for
              }else{
                    for(var x=xpxl1+1;x<=xpxl2-1;x++){
                    
                          plot(x,ipart(intery),rfpart(intery));
                          plot(x,ipart(intery)+1,fpart(intery));
                          intery    = intery+gradient;
                          
                    }//for
              }
              
        }//line
        
        
      </script>
