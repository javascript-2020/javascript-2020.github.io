<!DOCTYPE html>
<html>
      <head>
            <style>
            
  html
    {font-family:arial}
  body
    {margin:20px;display:flex;justify-content:center}
    
  #microphone-volume-meter
    {background-color:whitesmoke;border:1px solid blue;box-sizing:border-box;padding:20px;border-radius:10px;margin-top:30px;
      display:flex;flex-direction:column;gap:10px;max-width:1000px;flex:1}
      
  #btn
    {text-align:center;margin:0 0 10px}
  #aquire-microphone
    {background:hsl(217,91%,90%);color:gray;font-weight:bold;padding:10px 20px}
  #aquire-microphone:hover
    {background:lightyellow}
    
  #hdr
    {margin:0 0 10px}
  label:has(#audio)
    {border:1px solid gray;border-radius:5px;padding:5px 10px;display:inline-flex;align-items:center;gap:10px;cursor:pointer}
  [type=checkbox]
    {width:20px;height:20px}
    
    
  #gain-root
    {text-align:center}
    
  #range-root
    {display:flex;gap:10px;align-items:center}
  #range
    {flex:1}
    
    
  input[type=range]
    {-webkit-appearance:none;appearance:none;width:100%;margin:0;cursor:pointer;
      --h:18px;--col1:hsl(217,91%,90%);--col2:lightgray;height:var(--h);
    }
  input[type=range]::-webkit-slider-runnable-track
    {height:var(--h);border-radius:6px;
      background: linear-gradient(to right,var(--col1) 0%, var(--col1) var(--val,0%),
        var(--col2) var(--val,0%), var(--col2) 100%)
        
    }
  input[type=range]::-moz-range-track
    {height:var(--h);border-radius:6px;
      background: linear-gradient(to right,var(--col1) 0%, var(--col1) var(--val,0%),
        var(--col2) var(--val,0%), var(--col2) 100%)
    }
  input[type=range]::-webkit-slider-thumb
    {-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:hsl(217,91%,60%);
      margin-top:-1px}
  input[type=range]::-moz-range-thumb
    {width:22px;height:22px;border:none;border-radius:50%;background:hsl(217,91%,60%)}
    
    
  #peak
    {margin:25px 0 0}
    
  .meter-root
    {display:flex;flex-direction:column;gap:10px;
      border:1px solid lightgray;padding:10px
    }
  .meter-hdr
    {display:flex}
  .field
    {display:flex;gap:10px}
  .field label
    {width:100px;text-align:right}
  .field .value
    {width:60px;font-weight:bold}
    
  .meter
    {height:25px;width:100%;border:1px solid lightgray;border-radius:10px;position:relative;overflow:hidden}
  .meter-value
    {background:hsl(120,100%,90%);position:absolute;left:0;top:0;bottom:0;
      width:0%}
  .meter-max
    {position:absolute;left:0;top:0;bottom:0;border-right:2px solid orange;box-sizing:border-box;
      width:0%}
      
  audio
    {width:100%;border:1px solid lightgray;margin-top:20px}
    
  .record-root
    {border:1px solid lightgray;padding:5px 10px;display:flex;gap:10px;align-items:center}
  .record-root button
    {background:hsl(0,100%,85%);padding:5px 10px}
  .record-root button:hover
    {background:lightred}
    
  #output
    {flex:1;min-height:100px;border:1px solid lightgray;padding:5px;overflow:auto;white-space:pre;margin-top:20px}
    
  button
    {font-size:16px;cursor:pointer;border:none;border-radius:6px}
    
    
            </style>
      </head>
      
      <body>
      
            <div id=microphone-volume-meter>
            
                  <div id=btn>
                        <button id=aquire-microphone>
                              aquire microphone
                        </button>
                  </div>
                  
                  <div id=hdr>
                  </div>
                  
                  <div id=gain-root>
                        <span>
                              microphone gain
                        </span>
                        <span id=gain>
                              2.5
                        </span>
                  </div>
                  
                  <div id="range-root">
                        <div>
                              0.0
                        </div>
                        <input id=range type=range min=0 max=5 step=0.1 value=1.0>
                        <div>
                              5.0
                        </div>
                  </div>
                  
                  
                  <div id=peak class=meter-root>
                        <div class=meter-hdr>
                              peak
                              <div class=field>
                                    <label>
                                          value
                                    </label>
                                    <div id=value class=value>
                                          0.0
                                    </div>
                              </div>
                              <div class=field>
                                    <label>
                                          max
                                    </label>
                                    <div id=max class=value>
                                          0.0
                                    </div>
                              </div>
                        </div>
                        <div class=meter>
                              <div class=meter-value></div>
                              <div class=meter-max></div>
                        </div>
                  </div>
                  
                  
                  <div id=rms class=meter-root>
                        <div id=rms-root-hdr class=meter-hdr>
                              rms
                              <div class=field>
                                    <label>
                                          value
                                    </label>
                                    <div id=value class=value>
                                          0.0
                                    </div>
                              </div>
                              <div class=field>
                                    <label>
                                          max
                                    </label>
                                    <div id=max class=value>
                                          0.0
                                    </div>
                              </div>
                        </div>
                        <div class=meter>
                              <div class=meter-value></div>
                              <div class=meter-max></div>
                        </div>
                  </div>
                  
                  
                  <audio controls></audio>
                  
                  
                  <div class=record-root>
                        <button>
                              record start
                        </button>
                        <div id=time>
                              00:00:00
                        </div>
                  </div>
                  
                  
                  <div id=output>
                  </div>
                  
            </div>
            
      </body>
      
      <script>

        var stream;
        
        var audioctx        = new AudioContext();
        var gain            = audioctx.createGain();
        var analyser        = audioctx.createAnalyser();
        
        var abort;
        
        
        var root;
        var range;
        var meter;
        var audio;
        var output;
        
        
        
        
        
        
        var btn   = {};
        
        
        //:
        
        
        window.onload   = e=>initdom(document.body);
        
        
        //:
        
        
        
        
        async function initdom(rootnode){
        
              root                            = rootnode;
              
              $(root,'button').onclick        = btn.microphone;
              
              range                           = $(root,'#range');
              range.oninput                   = change;
              //range.dispatchEvent(new Event('input'));
              change();
              
              meter                           = $(root,'meter');
              
              audio                           = $('audio');
              
              output                          = $(root,'#output');
              output.replaceChildren();
              
              
        }//initdom
        
        
  //:
  
  
        function change(e){
        
              var v     = parseFloat(range.value);
              
              if(gain.gain){
                    gain.gain.value   = v;
              }
              
              var s   = v.toFixed(1);
              $(root,'#gain').textContent    = s;
              
              var min   = parseFloat(range.min);
              var max   = parseFloat(range.max);
              var p     = ((v-min)/(max-min))*100;
              range.style.setProperty('--val',p+'%');
              
        }//change
        
        
        btn.microphone    = async function(){
                                                                                log('aquiring microphone');
              var err;
              try{
              
                    stream        = await navigator.mediaDevices.getUserMedia({
                          video   : false,
                          audio   : {
                          
                                //full
                                /*
                                channelCount                : 1,
                                sampleRate                  : 48000,
                                sampleSize                  : 16,
                                latency                     : 0,
                                
                                autoGainControl             : true,
                                echoCancellation            : true,
                                noiseSuppression            : true,

                                googTypingNoiseDetection    : true,
                                googNoiseReduction          : true,
                                */
                                
                                //disable audio processing
                                
                                autoGainControl             : false,
                                channelCount                : 1,
                                echoCancellation            : true,
                                latency                     : 0,
                                noiseSuppression            : true,
                                //sampleRate                  : 48000,
                                //sampleSize                  : 16,
                                
                                //volume                      : 1.0
                                
                          }
                    });
                    
              }//try
              catch(err2){
              
                    err   = err2;
                    
              }//catch
              if(err){
                                                                                log('error');
                                                                                log(err.name);
                                                                                log(err.message);
                    return;
              }
                                                                                log('microphone ok');
                                                                                
              var source          = audioctx.createMediaStreamSource(stream);
              
              gain.gain.value     = 2.5;
              
              analyser.fftSize    = 2048;
              var data            = new Uint8Array(analyser.fftSize);
              
              var dest            = audioctx.createMediaStreamDestination();
              
              source.connect(gain);
              gain.connect(analyser);
              analyser.connect(dest);
              
              audio.srcObject   = dest.stream;
              audio.play();
              
              update();
              
        }//microphone

        btn.microphone.release    = function(){
        
              close();
              
        }//release
        
        
        btn.record    = function(){
        
              var mediaRecorder;
              var recordedChunks    = [];
              
              var audioStream       = analyser.stream;
              mediaRecorder         = new MediaRecorder(audioStream,{mimeType:'audio/webm'});
              
              mediaRecorder.ondataavailable   = e=>{
              
                    if(e.data.size>0){
                          recordedChunks.push(e.data);
                    }
                    
              }//ondataavailable
              
              mediaRecorder.onstop    = ()=>{
              
                    const blob = new Blob(recordedChunks, { type: 'audio/webm' });
                    const audioUrl = URL.createObjectURL(blob);
                    
                    const audio = new Audio(audioUrl);
                    audio.controls = true;
                    document.body.appendChild(audio); // or bind to a download link
                    
              }//onstop
              
              mediaRecorder.start();
              
              // Stop recording after N seconds or on button click
              // mediaRecorder.stop();
              
              
        }//record
        
        
  //:
  
  
        function close(){
        
              if(stream){
                    stream.getTracks().forEach(track=>track.stop());
              }
              stream    = null;
              abort     = true;
                                                                                console.log('closed');
        }//onclose
        
        
        function update(){
        
              if(abort)return;
              
              update.peak();
              update.rms();
              
              requestAnimationFrame(update);
              
        }//update
        
        
        update.peak   = function(){
        
              analyser.getByteTimeDomainData(data);
              
              var max   = 0;
              var sum   = 0;
              
              for(var amplitude of data){
              
                    var a   = Math.abs(amplitude-127);
                    if(a>max){
                          max   = a;
                    }
                    
              }//for
              
              $('#peak .meter-value').style.width   = '50%';
              //meter.value   = max/128;
              
        }//peak
        
        
        update.rms    = function(){
        
              var data    = new Uint8Array(analyser.frequencyBinCount);
              console.log(data.length);
              analyser.getByteTimeDomainData(data);
              
              var sumSquares    = 0;
              for(var i=0;i<data.length;i++){
              
                    var normalized    = (data[i]-128)/128;
                    sumSquares       += normalized*normalized;
                    
              }//for
              
              var rms   = Math.sqrt(sumSquares/data.length);
                                                                                // Scale RMS dynamically to fill the meter nicely
              var pct   = Math.min(100,Math.round(rms*400));
              $('#rms .meter-value').style.width    = `${pct}%`;
              
        }//rms
        
        
        function log(str){
        
              output.append(str,'\n');
              
        }//log
        
        
        
        function $(root,sel){return (!sel&&(sel=root,root=document),root.querySelector(sel))}
        
        
      </script>
      
</html>
