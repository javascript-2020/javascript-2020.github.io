        }//init
        
        
  //:
  
  
        obj.initdom   = async function(){
        
              shadow                    = host.shadowRoot;
              
              var initmod               = {config:{icons:{close:false}}};
              viewport                  = await vm.new({initmod,title:'webcontainer ports',icon:icon_src});
              obj.viewport              = viewport;
              viewport.pos({x:200,y:200,w:1000,h:200});
              viewport.hide();
              
              root                      = $(shadow,'#root');
              viewport.body.append(host);
              root.style.display        = '';
              
              list                      = $(root,'#list');
              item                      = $(list,'.item');
              item.remove();
              
        }//initdom
        
        
  //:
  
  
  
        obj.add   = function(port,url){
        
              var nitem                       = item.cloneNode(true);
              
              $(nitem,'.port').textContent    = port;
              $(nitem,'.url').textContent     = url;
              $(nitem,'.open').onclick        = open;
              $(nitem,'.copy').onclick        = async e=>{
              
                                                      await navigator.clipboard.writeText(url);
                                                      
                                                }//copy
              list.append(nitem);
              
              
              async function open(e){
              
                    e.stopPropagation();
                    var node    = document.createElement('webcontainer-iframe');
                    node.setAttribute('component','page');
                    var mod2      = mod.create({mod,name:'webcontainer-iframe'});
                    var result    = await mod.build({root:node,mod:mod2});
                    var wciframe    = mod2['webcontainer-iframe'];
                    wciframe.initmod({vm});
                    await mod2.auto();
                    wciframe.viewport.pos({x:200,y:200,w:1100,h:500});
                    wciframe.viewport.show();
                    wciframe.set(url);
                    return wciframe;
                    
              }//open
              
        }//add
        
        
        obj.remove    = function(port){
        
              port       += '';
              var item    = $.all(list,'.item').find(item=>$(item,'.port').textContent.trim()===port);
              if(!item){
                    return;
              }
              item.remove();
              
        }//remove
        
        
        obj.show    = function(){
        
              viewport.show();
              
        }//show
        
        
        obj.hide    = function(){
        
              viewport.hide();
              
        }//hide
        
        
        
  //:
  
  return obj;
