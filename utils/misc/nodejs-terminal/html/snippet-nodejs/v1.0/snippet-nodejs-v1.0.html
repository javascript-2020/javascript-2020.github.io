<webcontainer-nodejs>

      <template shadowrootmode=open>
      
            <style>
            
  :host
    {display:flex;flex-direction:column;flex:1}
  #root
    {display:flex;flex-direction:column;flex:1}
    
  web-editor
    {flex:1}
    
    
  #btns
    {margin:5px 0;display:flex}
    
  .con-btn
    {display:flex;align-items:center;gap:10px;border:1px solid lightgray;padding:0 10px;cursor:pointer}
    
    
  input
    {font-size:16px;padding:5px 10px;box-sizing:border-box}
  input[type=button]
    {cursor:pointer}
  input[type=checkbox]
    {width:20px;height:20px;margin:0}
    
            </style>
            
            <div id=root>
            
                  <div id=hdr>
                  </div>
                  
                  <web-editor component>
                  </web-editor>
                  
                  <div id=btns>
                        <input value=run type=button>
                        <input value=kill type=button>
                        <div id=persist class=con-btn>
                              persist
                              <input type=checkbox>
                        </div>
                        <div id=echo class=con-btn>
                              echo
                              <input type=checkbox checked>
                        </div>
                        <input value=clear type=button>
                        
                  </div>
                  
                  <web-terminal component>
                  </web-terminal>
                  
            </div>
            
      </template>
      
      <script>
      
(function({mod,host}){

  var obj   = {
        version   : 'v1.0.0',
  };
  
        var df=true,did='webcontainer-terminal';
        
        var $,vm,ace,webcontainer
        ;
        
        obj.initmod   = function(params){
        
              $                 = mod.rd(params,'$',$);
              vm                = mod.rd(params,'vm',vm);
              ace               = mod.rd(params,'ace',ace);
              webcontainer      = mod.rd(params,'webcontainer',webcontainer);
              debug             = mod.rd(params,'debug',debug);
              
        }//initmod
        
        
  //vars:-
  
  
        var viewport;
        var editor;
        var term;
        
        var tmpfile   = '/tmp.js';
        var tmpfile2    = '~/user/tmp.js';
        
        
        var chk   = {};
        
        
        
        var btn   = {};
        
        
  //:
  
  
        obj.init    = async function(){
                                                                                debug('init');
              mod.base.add({ace});
              await mod.auto();
              
              editor    = mod['web-editor'];
              term      = mod['web-terminal'];
              
              
              await initdom();
              
              
        }//init
        
        
  //:
  
  
        async function initdom(){
        
              viewport    = await vm.new();
              viewport.pos({x:250,y:200,w:850,h:500});
              viewport.css(`#body {display:flex;flex-direction:column}`);
              viewport.body.append(host);
              
              shadow                                  = host.shadowRoot;
              
              $(shadow,'[value=run]').onclick         = btn.run;
              
              chk.persist                             = $.chkbox(shadow,'#persist');
              chk.echo                                = $.chkbox(shadow,'#echo');
              
              $(shadowm,'[value=clear]').onclick      = btn.clear;
              
              
        }//initdom
        
        
  //:
  
  
        btn.run   = async function(){
        
              var js        = editor.get();
              await webcontainer.fs.writeFile(tmpfile,js);
              
              if(!chk.persist.checked){
                    term.clear();
              }
              
              var cmdline   = `node ${tmpfile2}`;
              var args      = cmdline.split(' ');
              var cmd       = args.shift();
              process       = await webcontainer.spawn(cmd,args);//,{cwd,output:true});
              
              var stream    = new WritableStream({write(data){
              
                    term.log(data);
                    if(chk.echo.checked){
                          console.log(data);
                    }
                    
              }});
              process.output.pipeTo(stream)
              
              var code      = await process.exit;
              
              term.log('process exited :',code);
              if(chk.echo.checked){
                    console.log('process exited :',code);
              }
              
        }//run
        
        
        btn.kill    = async function(){
        
              if(!process){
                    term.log('no process');
                    return;
              }
              
              await process.kill();
              
        }//kill
        
        
        btn.clear   = function(){
        
              term.clear();
              
        }//clear
        
        
  //:
  
  
  
  
  return obj;
  
})

      </script>
      
</webcontaner-nodejs>
