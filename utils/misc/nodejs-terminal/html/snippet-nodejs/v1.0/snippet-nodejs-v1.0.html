<webcontainer-nodejs>

      <template shadowrootmode=open>
      
            <style>
            
  :host
    {display:flex;flex-direction:column;flex:1}
  #root
    {display:flex;flex-direction:column;flex:1}
    
  web-editor
    {flex:1}
    
    
  input
    {font-size:16px;padding:5px 10px;box-sizing:border-box}
    
            </style>
            
            <div id=root>
            
                  <div id=hdr>
                  </div>
                  
                  <web-editor component>
                  </web-editor>
                  
                  <div id=btns>
                        <input value=test type=button>
                  </div>
                  
                  <web-console component>
                  </web-console>
                  
            </div>
            
      </template>
      
      <script>
      
(function({mod,host}){

  var obj   = {
        version   : 'v1.0.0',
  };
  
        var df=true,did='webcontainer-terminal';
        
        var $,vm
        ;
        
        obj.initmod   = function(params){
        
              $           = mod.rd(params,'$',$);
              vm          = mod.rd(params,'vm',vm);
              debug       = mod.rd(params,'debug',debug);
              
        }//initmod
        
        
  //vars:-
  
  
        var viewport;
        
        
  //:
  
  
        obj.init    = async function(){
                                                                                debug('init');
                                                                                
              await mod.auto();
              
              await initdom();
              
              
        }//init
        
        
  //:
  
  
        async function initdom(){
        
              viewport    = await vm.new();
              viewport.pos({x:250,y:200,w:850,h:500});
              viewport.css(`#body {display:flex;flex-direction:column;flex:1}`);
              viewport.body.append(host);
              
              shadow    = host.shadowRoot;
              
              $(shadow,'[value=test]').onclick    = e=>alert('test');
              
              
        }//initdom
        
        
  //:
  
  
  return obj;
  
})

      </script>
      
</webcontaner-nodejs>
