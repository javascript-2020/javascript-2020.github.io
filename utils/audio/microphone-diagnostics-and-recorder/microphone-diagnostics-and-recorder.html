      <script>
      
      
      
/*

                                                                                console.clear();
                                                                                console.log('microphone-volume-meter');
                                                                                console.log();
        var stream;
        var abort;
        
        var audioctx        = new AudioContext();
        var gain            = audioctx.createGain();
        var analyser        = audioctx.createAnalyser();
        var dest            = audioctx.createMediaStreamDestination();
        
        var mediaRecorder;
        
        
        var root;
        var range;
        var meter;
        var output;
        
        var record_start;
        
        
        
        
        var btn           = {};
        var microphone    = {};
        var record        = {};
        record.list       = [];
        var audio         = {};
        var device        = {};
        device.ui         = {};
        
        
  //:
  
  
        async function initdom(rootnode){
        
              root                                              = rootnode;
              
              $(root,'button').onclick                          = btn.microphone;
              
              $('#device-list-root #list').onclick              = btn.device;
              device.ui.list                                    = $('#device-list');
              device.ui.item                                    = $(device.ui.list,'.device');
              device.ui.item.remove();
              device.ui.item.style.display                      = '';
              device.ui.empty                                   = $(device.ui.list,'#empty');
              
              range                                             = $(root,'#range');
              range.oninput                                     = change;
              //range.dispatchEvent(new Event('input'));
              change();
              $('[value="+"]').onclick                          = btn.inc;
              
              
              audio.obj                                         = $('audio');
              
              
              $('#record-root button').onclick                  = btn.record;
              record.log                                        = $('#record-root .recording');
              record.log.remove();
              record.log.style.display                          = '';
              
              
              output                                            = $(root,'#output');
              output.replaceChildren();
              
              
        }//initdom
        
        
  //:
  
  
        function change(e){
        
              var v     = parseFloat(range.value);
              
              if(gain.gain){
                    gain.gain.value   = v;
              }
              
              var s   = v.toFixed(1);
              $(root,'#gain').textContent    = s;
              
              var min   = parseFloat(range.min);
              var max   = parseFloat(range.max);
              var p     = ((v-min)/(max-min))*100;
              range.style.setProperty('--val',p+'%');
              
        }//change
        
        
        btn.microphone    = async function(){
        
              if(!stream){
                    $('#microphone').textContent   = 'close microphone';
                    setup_audio();
              }else{
                    $('#microphone').textContent     = 'open microphone';
                    close_audio();
              }
              
        }//microphone
        
        
        btn.record    = function(){
        
              if(!dest.stream){
                    log('no audio stream');
                    return;
              }
              
              if(!mediaRecorder || mediaRecorder.state!='recording'){
                    record.start();
              }else{
                    record.stop();
              }
              
        }//record
        
        
        btn.device    = function(){
        
              device.enumerate();
              
        }//device
        
        
        btn.inc   = function(e){
        
              range.max                     = parseFloat(range.max)+1;
              $('#range-max').textContent   = parseFloat(range.max).toFixed(1);
              change();
              
        }//inc
  //:
  
  
        function update(){
        
              if(abort)return;
              
              update.peak();
              update.rms();
              update.record();
              
              requestAnimationFrame(update);
              
        }//update
        
        
        update.peak   = function(){
        
              var data    = new Uint8Array(analyser.fftSize);
              analyser.getByteTimeDomainData(data);
              
              var max   = 0;
              var sum   = 0;
              
              for(var amplitude of data){
              
                    var a   = Math.abs(amplitude-128);
                    if(a>max){
                          max   = a;
                    }
                    
              }//for
              
              if(max>update.peak.max){
                    update.peak.max   = max;
              }
              
              var p     = (max/128)*100;
              var p1    = (update.peak.max/128)*100;
              
              $('#peak #value').textContent         = p.toFixed(1)+'%'
              $('#peak #max').textContent           = p1.toFixed(1)+'%';
              $('#peak .meter-value').style.width   = p+'%';
              $('#peak .meter-max').style.width     = p1+'%';
              
        }//peak

              analyser.getByteTimeDomainData(data);
              
              var sum   = 0;
              for(var i=0;i<data.length;i++){
              
                    var center    = data[i]-128;
                    sum          += center*center;
                    
              }//for
              
              var rms   = Math.sqrt(sum/data.length);
              if(rms>update.rms.max){
                    update.rms.max    = rms;
              }
              
              var p     = (rms/128)*100;
              var p1    = (update.rms.max/128)*100;
              
              $('#rms #value').textContent          = p.toFixed(1)+'%'
              $('#rms #max').textContent            = p1.toFixed(1)+'%';
              $('#rms .meter-value').style.width    = p+'%';

              var day     = String(now.getDate()).padStart(2,'0');

              var dur     = `${hour}:${min}:${sec}`;
