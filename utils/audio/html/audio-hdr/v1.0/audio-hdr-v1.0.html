

<audio-hdr>

      <template shadowrootmode=open>
      
            <style>
            
  :host
    {margin-bottom:10px;position:relative;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    
  #icon
    {width:15px;height:22px;padding:2px;margin-left:10px;background:white;border:1px solid lightgray;border-radius:3px;box-sizing:border-box;cursor:pointer}
    
    
  #page-loading img
    {border-radius:3px;border:1px solid gray;box-sizing:border-box;
      width:34px;height:34px;
    }
    
    
  .menu
    {position:absolute;left:0;top:35px;width:150px}
    
  .item
    {display:inline-flex;align-items:center;text-align:center;background:buttonface;
      border-radius:3px;border:1px solid lightgray;padding:5px 7px;
    }
    
  .item-label
    {}
    
  ::slotted([slot=title])
    {text-align:center;position:absolute;left:0;right:0;top:0px;z-index:-1;margin:0 auto}
    
  ::slotted([slot=filename]), [name=filename]
    {}
    
  ::slotted([slot=version]), [name=version]
    {color:blue;font-weight:bold;margin:0 20px}
    
  ::slotted([slot=seo-hdr])
    {position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);border:0}
    
  .date
    {}
    
  a
    {color:blue;}
  a:visited
    {color:blue;}
    
    
  input[type=button]
    {font-size:16px;padding:5px 10px;cursor:pointer}
    
            </style>
            
            <div id=page-loading>
                  <img id=icon src='/images/spinner.gif'>
                  <!--
                  <div id=txt>
                        loading
                  </div>
                  -->
            </div>
            
            <slot name=seo-hdr class=visually-hidden></slot>
            <slot name=title></slot>
            
            <div class=item>
            
                  <a id=home class=item-label href='/'>
                        home
                  </a>

                  <div class=menu style='display:none'>
                        <div class=menu-title>
                              audio
                        </div>
                        <div class=menu-opt>test</div>
                  </div>
                  
            </div>
            
            <div id=btns>
            </div>
            
            <div style='flex:1'></div>
            
            <page-source component></page-source>
            
            <slot name=filename></slot>
            
            <slot name=version></slot>
            
            <slot name=date class=date></slot>
            
      </template>
      
      
      <script>
      
(function({mod,host}){

  var obj   = {
        version   : 'v1.0'
  };
  
        var df=true,did='audio-hdr';
        
        var ext,$,menu,debug
        ;
        
        obj.initmod   = function(...list){
        
              list.forEach(params=>{
              
                    ext       = mod.rd(params,'ext',ext);
                    $         = mod.rd(params,'$',$);
                    menu      = mod.rd(params,'menu',menu);
                    debug     = mod.rd(params,'debug',debug);
                    
              });
              
        }//initmod
        
        
  //:
  
  
        var blank_png   = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=';
        
        
        var shadow;
        
        
        var set   = {};
        obj.set   = set;
        
        
  //:
  
  
        obj.init    = async function(){
                                                                                debug=eval(debug.mod);
                                                                                debug('init',obj.version);
              await mod.auto();
              
              obj['page-source']    = mod['page-source'];
              
        }//init
        
        
        obj.init.complete   = function(){
                                                                                debug('init.complete');
              $(shadow,'#page-loading img').src             = blank_png;
              $(shadow,'#page-loading').style.visibility    = 'hidden';
              
        }//complete
        
        
  //:
  
  
        obj.initdom   = function(rootnode){
        
              shadow                          = host.shadowRoot;
              
              menu.add.style(shadow);
              
              
              var card                        = $(shadow,'.menu');
              $(shadow,'#icon').onclick       = menu.click(card,false,false);
              
              
              set.filename();
              if(typeof version==='undefined'){
                    set.version('v1.0');
              }else{
                    set.version(version);
              }
              
        }//initdom
        
        
  //:
  
  
        set.filename    = function(fn){
        
              if(!fn){
                    var str       = window.location.toString();
                    var i         = str.lastIndexOf('/');
                    fn            = str.slice(i+1);
              }
              $(shadow,'[name=filename]').textContent   = fn;
              
        }//filename
        
        
        set.version   = function(version){
        
              $(shadow,'[name=version]').textContent    = version;
              
        }//version
        
        
        obj.complete    = function(){
        
        
        }//complete
        
        
  //:
  
  
  
  
  return obj;
  
})//audio-hdr


      </script>
      
</audio-hdr>
