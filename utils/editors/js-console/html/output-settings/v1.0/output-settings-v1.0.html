            <div class=menu-root>
            
                  <img id=settings class=icon>
                  
                  <div class=menu style='display:none;/*width:300px;height:200px;*/'>
                  
                        <div class=menu-div>
                              console
                        </div>
                        
                        <span id=console-echo class=radio>
                              <input type=checkbox checked>
                              echo
                        </span>
                        
                        <div class=menu-div>
                              output
                        </div>
                        
                        <span id=output-type>
                              <span id=pretty-print class=radio>
                                    <input type=checkbox checked>
                                    prettyPrint
                              </span>
                              <span id=console class=radio>
                                    <input type=checkbox>
                                    console
                              </span>
                        </span>
                        
                        
                        <div class=menu-div>
                              iframe
                        </div>
                        
                        <span id=iframe-show class=radio>
                              <input type=checkbox checked>
                              iframe
                        </span>
                        
                        <span id=isolate class=radio>
                              <input type=checkbox disabled>
                              isolate
                        </span>
                        
                        <div id=attr-btns>
                              <iframe-sandbox v1.0 component=grp></iframe-sandbox>
                              <iframe-permissions v1.0 component=grp></iframe-permissions>
                        </div>
                        
                        
                  </div menu>
                  
            </div menu-root>
            
      </template>
      
      <script>
      
(function({mod,host}){

  var obj   = {
        version   : 'v1.0',
  };
  
        var df=true,did='output-settings';
        
        var $,debug,menu,output
        ;
        
        obj.initmod   = function(...list){
        
              list.forEach(params=>{
              
                    $             = mod.rd(params,'$',$);
                    debug         = mod.rd(params,'debug',debug);
                    menu          = mod.rd(params,'menu',menu);
                    output        = mod.rd(params,'output',output);
                    
              });
              
        }//initmod
        
        
  //:
  
  
        var sandbox;
        var permissions;
        
        
        var sandbox_def     = 'allow-scripts allow-same-origin allow-forms allow-downloads allow-pointer-lock allow-modals allow-popups';
        var sandbox_allow   = `clipboard-write; clipboard-read; camera; microphone; geolocation; accelerometer; gyroscope; magnetometer; payment; usb; serial; bluetooth;
                                  xr-spatial-tracking; autoplay; encrypted-media; picture-in-picture; screen-wake-lock; web-share`;
                                  
                                  
        var shadow;
        
        var chk             = {};
        obj.chk             = chk;
        chk.console         = {};
        
        
        var btn             = {};
        
        
  //:
  
  
        obj.init    = async function(){
        
              mod.initmod(obj);
                                                                                debug=eval(debug.mod);
                                                                                debug('init');
                                                                                
              sandbox   = mod['iframe-sandbox'];
              sandbox.initmod({def:sandbox_def,output});
              
              permissions   = mod['iframe-permissions'];
              permissions.initmod({def:sandbox_allow,output});
              
              await mod.auto();
              
              
        }//init
        
        
  //:
  
  
        obj.initdom   = async function(){
                                                                                debug('initdom');
                                                                                
                                                                                
              shadow                                    = host.shadowRoot;
              
              var style                                 = $(shadow,'style');
              $.stylesheet.copyrule('#page-inline','.icon',style);
              menu.add.style(shadow);
              
              var node                                  = $(shadow,'.menu');
              $(shadow,'#settings').onclick             = menu.click(node,'both',false);
              
              chk['console-echo']                       = $.chkbox(shadow,'#console-echo');
              
              chk.isolate                               = $.chkbox(shadow,'#isolate');
              //chk.isolate.checked                       = window.crossOriginIsolated;
              
              var r                                     = $(shadow,'#output-type');
              chk.type                                  = $.chkbox.group(r,'#pretty-print','#console');
              chk.type.callback                         = btn.type;
              
              chk.iframe                                = $.chkbox(shadow,'#iframe-show',btn.iframe);
              
              
              
        }//initdom
        
        
  //:
  
  
/*
        btn.isolate   = function(chk){
        
              if(chk.checked){
                    sandbox_url  += '?isolate';
              }else{
                    var i         = ssandbox_url.indexOf('?');
                    sandbox_url   = sandbox_url.slice(0,i);
              }
              
        }//isolate
*/


        btn.type    = function(chk,id){
        
              output.set.type(id);
              
        }//type
        
        
        btn.iframe   = function(chk){
                                                                                //debug('btn.iframe');
              output.set.iframe(chk.checked);
              
        }//show
        
        
  //:
  
  
        obj.sandbox   = function(iframe){
        
              var attr      = sandbox.build();
                                                                                debug(attr);
              iframe.setAttribute('sandbox',attr);
              
        }//allow
        
        
        obj.allow   = function(iframe){
        
              var attr    = permissions.build();
                                                                                debug(attr);
              iframe.setAttribute('allow',attr);
              
        }//allow
        
        
        
        
        
        
  return obj;
  
//output-settings
})

      </script>
      
</output-settings>
