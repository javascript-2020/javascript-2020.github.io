            <img id=icon class=icon>
            
            <div class=menu style='display:none'>
            
                  <div class=menu-title>
                        js console
                  </div>
                  
                  <div id=clear class=menu-opt>clear</div>
                  <div id=new class=menu-opt>new</div>
                  <div id=fork class=menu-opt>fork</div>
                  
                  <div class=divider>
                        examples
                  </div>
                  
                  <div id=hello-world class=menu-opt>hello world</div>
                  <div id=confetti class=menu-opt>confetti</div>
                  
            </div>
            
      </template>
      
      
      
      <script>
      
(function main_menu({mod,dom,host}){

  var obj   = {};
  
      //var df=true,did='main-menu';
      
      var $,menu,editor,filemod,par
      ;
      
      obj.initmod   = function(params){
      
                  $             = mod.rd(params,'$',$);
                  menu          = mod.rd(params,'menu',menu);
                  editor        = mod.rd(params,'editor',editor);
                  filemod       = mod.rd(params,'filemod',filemod);
                  par           = mod.rd(params,'par',par);
                  
      }//initmod
      
      
  //vars:-
  
  
  //:
  
  
      obj.init    = function(){
      
            mod.initmod(obj);
            
      }//init
      
      
  //:
  
  
      obj.initdom   = function(){
      
            var shadow                    = host.shadowRoot;
            
            var style                     = $(shadow,'style');
            $.stylesheet.copyrule('#page-inline','.icon',style);
            
            menu.add.style(shadow);
            
            
            var card                      = $(shadow,'.menu');
            $(shadow,'#icon').onclick     = menu.click(card,false,false,click);
            
            
      }//initdom
      
      
  //:
  
  
      function click(type,opt){
      
            if(type=='opt'){
                  click[opt.id]();
            }
            
      }//menu
      
      
      click.clear    = function(){
      
            par.clear();
            
      }//clear
      
      
      click.new    = function(){
      
            var win   = window.open('https://javascript-2020.github.io/utils/editors/js-console/js-console.html');
            return win;
            
      }//new
      
      
      click.fork   = function(){
      
            var win   = menu.new();
            var txt   = editor.getValue();
            win.postMessage({txt},'*');
            
      }//fork
      
      
      click['ello-world']   = function(){
      
      }//hello-world
      
      
      click.confetti    = function(){
      
            editor.setvalue(examples.confetti,{initial:true});
            
      }//confetti
      
      
      var examples   = {};
      
      examples['hello-world']   = `
      
            var str   = 'hello-world';
            var i     = 1;
            setInterval(fn,250);
            fn();
            
            function fn(){
            
                  var s   = str.slice(0,i);
                  console.log(s);
                  i++;
                  if(i==str.length){
                        i   = 1;
                  }
                  
            }//fn
            
      `;
      
      examples.confetti   = `
      
        //execute as a module
        
        import confetti from 'https://esm.sh/canvas-confetti';
        confetti();
        
      `;
      
      
      
  return obj;
  
//main_menu
})

      </script>
      
</main-menu>
