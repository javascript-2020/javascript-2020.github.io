

<code-explorer-css>

      <template shadowrootmode=open>
      
            <style>
            
  .css
    {}
    
  .css .line
    {}
    
  .css .indent
    {}
    
  .css .sel
    {}
    
            </style>
            
            <div class='css item'>
            
                  <div class=line>
                  </div>
                  <div class=indent>
                  </div>
                  <div class='sel main'>
                  </div>
                  
            </div>
            
      </template>
      
      
      <script>
      
(function({mod,host}){

  var obj   = {
        version   : 'v1.0',
  };
  
        var df=true,did='code-explorer-css';
        
        var debug,$,explorer,ctx,editor
        ;
        
        obj.initmod   = function(...list){
        
              list.forEach(params=>{
              
                    debug       = mod.rd(params,'debug',debug);
                    $           = mod.rd(params,'$',$);
                    explorer    = mod.rd(params,'explorer',explorer);
                    ctx         = mod.rd(params,'ctx',ctx);
                    editor      = mod.rd(params,'editor',editor);
                    
              });
              
        }//initmod
        
        
  //:
  
  
        var shadow;
        var view;
        var empty;
        var item;
        
        
  //:
  
  
        obj.init    = async function(){
        
              explorer.update.css   = update;
              
        }//init
        
        
  //:
  
  
        obj.initdom   = async function(params){
        
              shadow                    = host.shadowRoot;
              
              var {shadow:par}          = params;
              ({view,empty}             = params);
              
              var style                 = $(shadow,'style');
              par.append(style);
              
              item                      = $(shadow,'.css');
              item.remove();
              
        }//initdom
        
        
  //:
  
  
        obj.update    = function(txt){
        
              ctx.set.mode('html');
              update(txt);
              
        }//update
        
        
        function update(txt){
        
              var list    = parse.html(txt);
                                                                                //console.log(list);
              view.replaceChildren();
              
              if(list.css.length==0){
                    view.append(empty);
              }
              
              list.css.forEach(o=>{
              
                    var node                              = item.cloneNode(true);
                    
                    $(node,'.line').textContent           = o.line;
                    $(node,'.indent').style.width         = (o.indent*3)+'px';
                    $(node,'.sel').textContent            = o.sel;
                    
                    node.onclick                          = e=>editor.gotoline(o.line,o.col);
                    
                    view.append(node);
                    
              });
              
        }//update
        
        
        
        parse.html    = function(txt){
        
              var list      = {};
              list.css      = [];
              list.label    = [];
              
              var index     = 0;
              var ec        = true;
              while(ec){
              
                    var i1    = txt.indexOf('<style>',index);
                    if(i1==-1)break;
                    var i2    = txt.indexOf('</style>',index);
                    if(i2==-1)break;
                    
                    //var line    = lineno(txt,i1+8);
                    var str     = txt.slice(i1+8,i2);
                    
                    var arr   = parse(str);
                    arr.forEach(o=>{
                    
                          o.index    += i1+8
                          var line    = ctx.lineno(txt,o.index);
                          o.line      = line;
                          
                    });
                    list.push(...arr);
                    
                    
                    /*
                    var arr   = parse.label(str);
                    arr.forEach(o=>{
                    
                          o.index    += i1+6
                          var line2   = lineno(txt,o.index);
                          o.line      = line2;
                          
                    });
                    list.label.push(...arr);
                    */
                    
                    
                    index   = i2+7;
                    
              }//while
              
              return list;
              
        }//html
        
        
        function parse(txt){
        
              var list    = [];
              var regex   = /([^{]+)\{([^}]+)\}/g;
              
              var ec    = true;
              while(ec){
              
                  var match   = regex.exec(txt);
                  if(match===null)break;
                  
                  var index           = match.index;
                  var sel             = match[1].trim();
                  var declarations    = match[2].trim();
                  
                  var col             = ctx.colno(txt,index);
                  
                  var o   = {
                        index,
                        col,
                        indent,
                        sel
                  };
                  list.push(o);
                  
              }//while
              
        }//parse
        
        
        
  return obj;
  
//code-explorer-css
})


      </script>
      
</code-explorer-css>
