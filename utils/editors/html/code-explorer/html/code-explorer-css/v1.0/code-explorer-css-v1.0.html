

<code-explorer-css>

      <template shadowrootmode=open>
      
            <style>
            
  .css-label
    {}
  .css-label .name
    {color:gray;font-style:italic}
    
  .css-sep
    {}
  .css-sep .decor
    {border-top:1px solid lightgray;flex:1}
  .css-sep .name
    {margin:0 7px}
    
  .css.item
    {}
    
  .css .line
    {}
    
  .css .indent
    {}
    
  .css .sel
    {}
    
  .css.sep
    {border-top:1px solid lightgray;margin:7px}
    
            </style>
            
            <div class='css-label item'>
                  <div class=line>
                  </div>
                  <div class=label>
                  </div>
            </div>
            
            <div id=style-start class='css-sep item'>
                  <div class=line>
                  </div>
                  <div class=decor>
                  </div>
                  <div class=name>
                        &lt;style&gt;
                  </div>
                  <div class=decor>
                  </div>
            </div>
            
            <div id=style-end class='css-sep item'>
                  <div class=line>
                  </div>
                  <div class=decor>
                  </div>
                  <div class=name>
                        &lt;/style&gt;
                  </div>
                  <div class=decor>
                  </div>
            </div>
            
            <div class='css item'>
            
                  <div class=line>
                  </div>
                  <div class=indent>
                  </div>
                  <div class='sel main'>
                  </div>
                  
            </div>
            
      </template>
      
      
      <script>
      
(function({mod,host}){

  var obj   = {
        version   : 'v1.0',
  };
  
        var df=true,did='code-explorer-css';
        
        var debug,$,explorer,ctx,editor
        ;
        
        obj.initmod   = function(...list){
        
              list.forEach(params=>{
              
                    debug       = mod.rd(params,'debug',debug);
                    $           = mod.rd(params,'$',$);
                    explorer    = mod.rd(params,'explorer',explorer);
                    ctx         = mod.rd(params,'ctx',ctx);
                    editor      = mod.rd(params,'editor',editor);
                    
              });
              
        }//initmod
        
        
  //:
  
  
        var shadow;
        var sep   = {};
        var label;
        var item;
        
        
        var type      = {};
        
        
  //:
  
  
        obj.init    = async function(){
                                                                                debug=eval(debug.mod);
                                                                                debug('init');
              explorer.update.css   = update;
              
        }//init
        
        
  //:
  
  
        obj.initdom   = async function(params){
        
              shadow                    = host.shadowRoot;
              
              var {shadow:par}          = params;
              
              var style                 = $(shadow,'style');
              par.append(style);
              
              sep.start                 = $(shadow,'#style-start');
              sep.start.remove();
              
              sep.end                   = $(shadow,'#style-end');
              sep.end.remove();
              
              label                     = $(shadow,'.css-label');
              label.remove();
              
              item                      = $(shadow,'.css.item');
              item.remove();
              
        }//initdom
        
        
  //:
  
  
        obj.create    = create;
        
        function create(o){
        
              var node;
              
              switch(o.type){
              
                case 'css-style-start'      : node    = create.style.start(o);        break;
                case 'css-style-end'        : node    = create.style.end(o);          break;
                case 'css-label'            : node    = create.label(o);              break;
                case 'css'                  : node    = create.css(o);                break;
                
              }//switch
              
              return node;
              
        }//create
        
        
        create.style    = {};
        
        create.style.start    = function(o){
        
              var nsep                          = sep.start.cloneNode(true);
              
              $(nsep,'.line').textContent       = o.line;
              
              nsep.onclick                      = e=>editor.gotoline(o.line,o.col);
              
              return nsep;
              
        }//start
        
        
        create.style.end    = function(o){
        
              var nsep                          = sep.end.cloneNode(true);
              
              $(nsep,'.line').textContent       = o.line;
              
              nsep.onclick                      = e=>editor.gotoline(o.line,o.col);
              
              return nsep;
              
        }//end
        
        
        create.label    = function(o){
        
              var nlabel                        = label.cloneNode(true);
              
              $(nlabel,'.line').textContent     = o.line;
              $(nlabel,'.label').textContent    = o.label;
              
              nlabel.onclick                    = e=>editor.gotoline(o.line,o.col);
              
              return nlabel;
              
        }//label
        
        
        create.css   = function(o){
        
              var node                          = item.cloneNode(true);
              
              $(node,'.line').textContent       = o.line;
              $(node,'.indent').style.width     = (o.indent*3)+'px';
              $(node,'.sel').textContent        = o.sel;
              
              node.onclick                      = e=>editor.gotoline(o.line,o.col);
              
              return node;
              
        }//css
        
        
  //:
  
  
/*
        obj.update    = function(txt){
        
              ctx.set.mode('html');
              update(txt);
              
        }//update
*/


        function update(txt,mode,label){
                                                                                var d=debug('update',mode,label);
              var list;
              
              switch(mode){
              
                case 'css'    : list    = css(txt,label);         break;
                case 'html'   : list    = html(txt,label);        break;
                
              }//switch
                                                                                //console.log(list);
              return list;
              
        }//update
        
        
        
        
        function css(txt,label){
        
              var list1   = [];
              if(!label){
                    var arr   = parse(txt);
                    arr.forEach(o=>{
                    
                          //o.index      += i1+7;
                                                                                //console.log(txt[o.index],txt[o.index+1]);
                          o.line      = ctx.lineno(txt,o.index);
                          o.col       = ctx.colno(txt,o.index)-1;
                          o.indent    = ctx.indent(txt,o.index);
                          
                          list1.push(o);
                          
                    });
              }
              
              var list2   = css.label(txt);
              
              var list    = ctx.merge(list1,list2);
              return list;
              
        }//css
        
        
        css.label   = function(txt){
        
              var list    = [];
              
              var arr     = parse.label(txt);
              arr=>forEach(o=>{
              
                    o.line      = ctx.lineno(txt,o.index);
                    o.col       = ctx.colno(txt,o.index)-1;
                    o.indent    = ctx.indent(txt,o.index);
                    
                    list.push(o);
                    
              });
              return list;
              
        }//label
        
        
        function html(txt,label){
        
              var list      = [];
              
              var index     = 0;
              var ec        = true;
              while(ec){
              
                    var i1    = txt.indexOf('<style>',index);
                    if(i1==-1)break;
                    var i2    = txt.indexOf('</style>',index);
                    if(i2==-1)break;
                    
                    var str     = txt.slice(i1+7,i2);
                    
                    var list1   = [];
                    var list2   = [];
                    if(!label){
                          var o   = html.style.start(txt,i1);
                          list1.push(o);
                          var o   = html.style.end(txt,i2);
                          list1.push(o);
                                                                                 //debugger;
                          list2   = html.style(str,txt,i1);
                    }
                    
                    var list3   = html.label(str,txt,i1);
                    
                    list    = ctx.merge(list,list1,list2,list3);
                                                                                //console.log(list);
                    index   = i2+7;
                    
              }//while
              
              return list;
              
        }//html
        
        
        html.style    = function(str,txt,i1){
        
              var list    = [];
              var arr     = parse(str);
              arr.forEach(o=>{
              
                    o.index    += i1+7;
                                                                                //console.log(txt[o.index],txt[o.index+1]);
                    o.line      = ctx.lineno(txt,o.index);
                    o.col       = ctx.colno(txt,o.index)-1;
                    o.indent    = ctx.indent(txt,o.index);
                    
                    list.push(o);
                    
              });
              
              return list;
              
        }//style
        
        
        html.label   = function(str,txt,i1){
        
              var list    = [];
              var arr     = parse.label(str);
              arr.forEach(o=>{
              
                    o.index    += i1+7;
                                                                                //console.log(txt[o.index],txt[o.index+1]);
                    o.line      = ctx.lineno(txt,o.index);
                    o.col       = ctx.colno(txt,o.index)-1;
                    o.indent    = ctx.indent(txt,o.index);
                    
                    list.push(o);
                    
              });
              return list;
              
        }//label
        
        
        html.style.start    = function(txt,index){
        
              var line    = ctx.lineno(txt,index);
              var o       = {type:'css-style-start',index,line}
              return o;
              
        }//sep
        
        
        html.style.end    = function(txt,index){
        
              var line    = ctx.lineno(txt,index);
              var o       = {type:'css-style-end',index,line}
              return o;
              
        }//end
        
        
  //:
  
  
        function parse(txt){
        
              var list    = [];
              
              //var regex   = /([^{]+)\{([^}]+)\}/g;
              //var regex = /(\s*)([^{]+)\{([^}]+)\}/g;
              //var regex = /(\s*)([^\r\n{]+?)\s*\{([^}]+)\}/g;
              var regex = /(\s*)([^\r\n{]+?)\s*\{([^}]*)\}/g;
              
              var ec    = true;
              while(ec){
              
                  var match   = regex.exec(txt);
                  if(match===null)break;
                  
                  var ws              = match[1];
                  var sel             = match[2].trim();
                  var dec             = match[3].trim();
                  
                  var index           = match.index+ws.length;
                                                                                //console.log(txt[index],txt[index+1]);
                                                                                //console.log('['+ws+']',sel,dec);
                  list.push({type:'css',index,sel});
                  
              }//while
              
              return list;
              
        }//parse
        
        
        parse.label   = function(txt){
        
              var list    = [];
              
              var regex   = /[^\S\r\n]*\/\*[^\S\r\n]*([^:\r\n]*):(?:[^\S\r\n]*\*\/)?/g;
              
              var ec    = true;
              while(ec){
              
                    var match   = regex.exec(txt);
                    if(match===null)break;
                    
                    var index     = match.index;
                    var line      = ctx.lineno(txt,index);
                    var label     = match[1].trim();
                    var indent    = ctx.indent(txt,index);
                    var col       = ctx.colno(txt,index);
                    
                    list.push({type:'css-label',index,line,col,label,indent});
                    
              }//while
              
              return list;
              
        }//label
        
        
        
        
        
        
        
  return obj;
  
//code-explorer-css
})


      </script>
      
</code-explorer-css>
