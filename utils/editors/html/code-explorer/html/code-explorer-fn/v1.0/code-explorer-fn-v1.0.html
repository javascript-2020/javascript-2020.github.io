

<code-explorer-fn>

      <template shadowrootmode=open>
      
            <style>
            
  .fn.sep
    {border-top:1px solid lightgray;margin:7px}
    
  .fn.item
    {}
  .fn .line
    {}
  .fn .indent
    {}
  .fn .name
    {}
  .fn .args
    {color:gray}
    
            </style>
            
            <div class='fn sep'></div>
            
            <div class='fn item'>
                  <div class=line>
                  </div>
                  <div class=indent>
                  </div>
                  <div class='name main'>
                  </div>
                  <div class=args>
                  </div>
            </div>
            
      </template>
      
      <script>
      
(function({mod,host}){

  var obj   = {
        version   : 'v1.0',
  };
  
        var df=true,did='code-explorer-fn';
        
        var debug,$,explorer,ctx,editor
        ;
        
        obj.initmod   = function(...list){
        
              list.forEach(params=>{
              
                    debug       = mod.rd(params,'debug',debug);
                    $           = mod.rd(params,'$',$);
                    explorer    = mod.rd(params,'explorer',explorer);
                    df          = mod.rd(params,'df',df);
                    ctx         = mod.rd(params,'ctx',ctx);
                    editor      = mod.rd(params,'editor',editor);
                    
              });
              
        }//initmod
        
        
  //:
  
  
        var shadow;
        
        var view;
        var empty;
        var sep;
        var item;
        
        
  //:
  
  
        obj.init    = async function(){
                                                                                debug=eval(debug.mod);
                                                                                debug('init');
              explorer.update.fn    = update;
              
        }//init
        
        
  //:
  
  
        obj.initdom   = async function(params){
                                                                                debug('initdom');
              shadow                    = host.shadowRoot;
              
              var {shadow:par}          = params;
              ({view,empty}             = params);
              
              var style                 = $(shadow,'style');
              par.append(style);
              
              sep                       = $(shadow,'.fn.sep');
              sep.remove();
              
              item                      = $(shadow,'.fn.item');
              item.remove();
              
        }//initdom
        
        
  //:
  
  
        function update(txt,mode){
                                                                //var d=debug('update');
              switch(mode){
              
                case undefined    :
                case 'js'         : mode='javascript';        break;
                
              }//switch
              
              var list    = parse[mode](txt);
                                                                debug(mode);
                                                                console.log(list);
              view.replaceChildren();
              
              if(list.fn.length==0){
                    view.append(empty);
              }
              
              list.fn.forEach(o=>{
              
                    if(o.type==='fn-sep'){
                          var node    = disp.sep(o);
                          view.append(node);
                          return;
                    }
                    
                    var node    = disp.item(o);
                    view.append(node);
                    
              });
              
              
        }//fn
        
        
        function disp(o){
        }//disp
        
        
        disp.sep    = function(o){
        
              var nsep    = sep.cloneNode(true);
              return nsep;
              
        }//sep
        
        
        disp.item   = function(o){
        
              var node                          = item.cloneNode(true);
              $(node,'.line').textContent       = o.line;
              $(node,'.indent').style.width     = (o.indent*3)+'px';
              $(node,'.name').textContent       = o.name;
              $(node,'.args').textContent       = o.args;
              
              node.onclick                      = e=>editor.gotoline(o.line,o.indent);
              
        }//item
        
        
  //:
  
  
  
        parse.javascript    = function(txt){
        
              var list      = {};
              
              list.fn       = parse(txt);
              list.fn.forEach(o=>o.line=ctx.lineno(txt,o.index));
              
              //list.label    = parse.label(txt);
              //list.label.forEach(o=>o.line=lineno(txt,o.index));
              
              return list;
        }//js
        
        
        parse.html    = function(txt){
        
              var list      = {};
              list.fn       = [];
              list.label    = [];
              
              var index     = 0;
              var ec        = true;
              while(ec){
              
                    var i1    = txt.indexOf('<scr'+'ipt>',index);
                    if(i1==-1)break;
                    var i2    = txt.indexOf('</scr'+'ipt>',index);
                    if(i2==-1)break;
                    
                    //var line    = lineno(txt,i1+8);
                    var str     = txt.slice(i1+8,i2);
                    
                    var arr   = parse(str);
                    arr.forEach(o=>{
                    
                          o.index    += i1+6
                          var line2   = ctx.lineno(txt,o.index);
                          o.line      = line2;
                          
                    });
                    list.fn.push(...arr);
                    
                    list.fn.push({type:'fn-sep'});
                    
                    /*
                    var arr   = parse.label(str);
                    arr.forEach(o=>{
                    
                          o.index    += i1+6
                          var line2   = lineno(txt,o.index);
                          o.line      = line2;
                          
                    });
                    list.label.push(...arr);
                    */
                    
                    
                    index   = i2+9;
                    
              }//while
              
              return list;
              
        }//html
        
        
        function parse(txt){
        
              var list    = [];
              var index   = 0;
              var ec      = true;
              while(ec){
              
                    var i1      = txt.indexOf('function',index);
                    if(i1==-1)break;
                    
                    var o;
                    
                    o   = type1(txt,i1);
                    if(o){
                          list.push(o);
                    }
                    o   = type2(txt,i1);
                    if(o){
                          list.push(o);
                    }
                    
                    index   = i1+8;
                    
              }//while
              
              return list;
              
        }//parse
        
        
        function type1(txt,i1){
        
              i1         += 8;
              var i2      = txt.indexOf('(',i1);
              var name    = txt.slice(i1,i2).trim();
              if(!valid(name))return;
              
              var args      = parse.args(txt,i1);
              var indent    = ctx.indent(txt,i1);
              var col       = ctx.colno(txt,i1);
              
              return {type:'fn',index:i1,col,name,args,indent};
              
        }//type1
        
        
        function type2(txt,i1){
        
              var i2    = txt.lastIndexOf('=',i1);
              if(i2==-1)return;
              
              var str   = txt.slice(i2+1,i1).trim();
              if(!(str=='' || str=='async'))return;
              
              for(var i3=i2-1;i3>=0;i3--){
              
                    var c   = txt[i3];
                    if(!/^\s*$/.test(c))break;
                    
              }//for
              
              for(var i4=i3;i4>=0;i4--){
              
                    var c   = txt[i4];
                    if(/^\s*$/.test(c))break;
                    //if(/[\s\W]/.test(c))break;
                    
              }//for
              
              var name    = txt.slice(i4+1,i3+1);
                                                                                console.log(name);
              if(!valid(name))return;
              
              var args      = parse.args(txt,i1);
              var indent    = ctx.indent(txt,i1);
              var col       = ctx.colno(txt,i1);
              
              return {type:'fn',index:i1,col,name,args,indent};
              
        }//type2
        
        
        parse.args    = function(txt,i1){
        
              var i2      = txt.indexOf('(',i1);
              var i3      = txt.indexOf(')',i2);
              var args    = txt.slice(i2,i3+1);
              args        = args.replace(' ','');
              return args;
              
        }//args
        
        
        
        
        
  //:
  
  
        parse.label   = function(txt){
        
              var list      = [];
              var regex     = /\/\/\s*([^:\r\n]+):/g;
              
              var ec    = true;
              while(ec){
              
                    var match   = regex.exec(txt);
                    if(match===null)break;
                    
                    var line    = lineno(txt,match.index);
                    var label   = match[1].trim();
                    
                    list.push({line,label});
                    
              }//while
              
              return list;
              
        }//label
        
        
        
        
  //:
  
  
        function valid(str){
        
              //var regex     = /^[a-zA-Z_$][0-9a-zA-Z_$]*$/
              var regex     = /^[a-zA-Z_$][0-9a-zA-Z_$.]*$/;
              var result    = regex.test(str);
              return result;
              
        }//valid
        
        
        
        
        
  return obj;
  
//code-explorer-fn
})

      </script>
      
</code-explorer-fn>
