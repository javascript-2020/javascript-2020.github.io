                  <img id=update class=icon>
                  <img id=fn class='icon active'>
                  <img id=html class=icon>
                  <img id=css class=icon>
            </div>
            
            <div id=hldr>
                  <div id=view>
                  
                        <div id=empty>
                              [ Empty ]
                        </div>
                        
                        <div class='label item'>
                        </div>
                        
                  </div view>
            </div>
            
            <div id=custom style='display:none'>
                  <code-explorer-fn v1.0 component=parent></code-explorer-fn>
                  <code-explorer-html v1.0 component=parent></code-explorer-html>
            </div>
            
      </template>
      
      <script>
      
(function({mod,host}){

  var obj   = {
        version   : 'v1.0',
  };
  
        var df=true,did='code-explorer';
        
        var debug,$,editor
        ;
        
        obj.initmod   = function(...list){
        
              list.forEach(params=>{
              
                    df          = mod.rd(params,'df',df);
                    debug       = mod.rd(params,'debug',debug);
                    $           = mod.rd(params,'$',$);
                    editor      = mod.rd(params,'editor',editor);
                    
              });
              
        }//initmod
        
  //:
  
  
        var explorer    = obj;
        var fn;
        var html;
        
        
        var shadow;
        
        
        var view;
        var ui          = {};
        ui.mode         = 'fn';
        
        
        
        
        var btn         = {};
        var set         = {};
        var ctx         = {};
        ctx.set          = set;
        
        var sort        = {};
        sort.alpha      = {};
        sort.source     = {};
        
        
        
  //:
  
  
        obj.init    = async function(){
                                                                                debug=eval(debug.mod);
                                                                                debug('init');
              fn      = mod['code-explorer-fn'];
              html    = mod['code-explorer-html'];
              
              mod.initmod([fn,html],{explorer,ctx,df,editor});
              await Promise.all([fn.init(),html.init()]);
              
              
              
        }//init
        
        
  //:
  
  
        obj.initdom   = async function(){
                                                                                debug('initdom');
                                                                                
              shadow                                  = host.shadowRoot;
              
              
              $(shadow,'#hdr #update').onclick        = btn.update;
              $(shadow,'#hdr #fn').onclick            = btn.fn;
              $(shadow,'#hdr #html').onclick          = btn.html;
              
              
              view                                    = $(shadow,'#view');
              
              var empty                               = $(shadow,'#empty');
              
              ui.label                                = $(shadow,'.label');
              ui.label.remove();
              
              
              var params    = {view,shadow,empty};
              await Promise.all([fn.initdom(params),html.initdom(params)]);
              
              
              $(shadow,'#custom').remove();
              
              
        }//initdom
        
        
  //:
  
  
        btn.update    = function(){
        
              update();
              
        }//update
        
        
        btn.fn    = function(){
        
              ui.mode   = 'fn';
              set.mode('fn');
              update();
              
        }//fn
        
        
        btn.html    = function(){
        
              ui.mode   = 'html';
              set.mode('html');
              update();
              
        }//html
        
        
  //:
  
  
        set.mode    = function(mode){
        
              ui.mode   = mode;
              
              var list    = $.all(shadow,'#hdr img');
              list.forEach(img=>{
              
                    if(img.id==mode){
                          img.classList.add('active');
                    }else{
                          img.classList.remove('active');
                    }
                    
              });
              
        }//mode
        
        
  //:
  
  
        obj.update    = update;
        
        function update(txt,mode){
        
              mode    ||= ui.mode;
              
              var emode   = editor.mode;
              if(!txt){
                    txt   = editor.getvalue();
              }
                                                                debug('update',mode);
              update[mode](txt,emode);
              
        }//update
        
        
        
        
        
        
  //:
  
  
  
  
        ctx.indent   = indent;
        
        function indent(txt,i1){
        
              var i2        = txt.lastIndexOf('\n',i1);
              var i3        = txt.indexOf('\n',i1);
              var line      = txt.slice(i2+1,i3);
              var match     = line.match(/^\s*/);
              var indent    = match ? match[0].length : 0;
              return indent;
              
        }//indent
        
        
        ctx.lineno   = lineno;
        
        function lineno(txt,i){
        
              var start       = 0;
              var end         = i;
              var substring   = txt.slice(start,end);
              var newlines    = substring.match(/\r\n|\n|\r/g);
              var count       = newlines ? newlines.length : 0;
              count++;
              return count;
              
        }//line
        
        
        ctx.colno    = colno;
        
        function colno(txt,index){
        
              var i1        = txt.lastIndexOf('\n',index);
              var col       = index-i1;
              return col;
              
        }//colno
        
        
        
        
        
        
        
  //:
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  return obj;
  
//code-explorer
})

      </script>
      
</code-explorer>
