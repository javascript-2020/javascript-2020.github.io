            <div id=hdr>
                  <img id=update class=icon>
                  <img id=fn class='icon active'>
                  <img id=html class=icon>
                  <img id=css class=icon>
                  <img id=label class=icon>
            </div>
            
            <div id=hldr>
                  <div id=view>
                  
                        <div id=empty>
                              [ Empty ]
                        </div>
                        
                        <div class='label item'>
                        </div>
                        
                  </div view>
            </div>
            
            <div id=custom style='display:none'>
                  <code-explorer-fn v1.0 component=parent></code-explorer-fn>
                  <code-explorer-html v1.0 component=parent></code-explorer-html>
                  <code-explorer-css v1.0 component=parent></code-explorer-css>
            </div>
            
      </template>
      
      <script>
      
(function({mod,host}){

  var obj   = {
        version   : 'v1.0',
  };
  
        var df=true,did='code-explorer';
        
        var debug,$,editor
        ;
        
        obj.initmod   = function(...list){
        
              list.forEach(params=>{
              
                    df          = mod.rd(params,'df',df);
                    debug       = mod.rd(params,'debug',debug);
                    $           = mod.rd(params,'$',$);
                    editor      = mod.rd(params,'editor',editor);
                    
              });
              
        }//initmod
        
  //:
  
  
        var explorer    = obj;
        var fn;
        var html;
        var css;
        
        
        var shadow;
        
        
        var view;
        var ui          = {};
        ui.mode         = 'fn';
        var empty;
        
        
        
        
        var btn         = {};
        var set         = {};
        var ctx         = {};
        ctx.set          = set;
        
        var sort        = {};
        sort.alpha      = {};
        sort.source     = {};
        
        
        
  //:
  
  
        obj.init    = async function(){
                                                                                debug=eval(debug.mod);
                                                                                debug('init');
              fn          = mod['code-explorer-fn'];
              obj.fn      = fn;
              
              html        = mod['code-explorer-html'];
              obj.html    = html;
              
              css         = mod['code-explorer-css'];
              obj.css     = css;
              
              mod.initmod([fn,html,css],{explorer,ctx,df,editor});
              await mod.init([fn,html,css]);
              
              
              
        }//init
        
        
  //:
  
  
        obj.initdom   = async function(){
                                                                                debug('initdom');
                                                                                
              shadow                                  = host.shadowRoot;
              
              
              $(shadow,'#hdr #update').onclick        = btn.update;
              $(shadow,'#hdr #fn').onclick            = btn.fn;
              $(shadow,'#hdr #html').onclick          = btn.html;
              $(shadow,'#hdr #css').onclick           = btn.css;
              $(shadow,'#hdr #label').onclick         = btn.label;
              
              
              view                                    = $(shadow,'#view');
              
              empty                                   = $(shadow,'#empty');
              
              ui.label                                = $(shadow,'.label');
              ui.label.remove();
              
              
              var params    = {shadow};
              await mod.initdom([fn,html,css],params);
              
              
              $(shadow,'#custom').remove();
              
              
        }//initdom
        
        
  //:
  
  
        btn.update    = function(e){
        
              if(e.shiftKey){
                    update('123','123','test');
                    return;
              }
              
              update();
              
        }//update
        
        
        btn.fn    = function(){
        
              set.mode('fn');
              update();
              
        }//fn
        
        
        btn.html    = function(){
        
              set.mode('html');
              update();
              
        }//html
        
        
        btn.css   = function(){
        
              set.mode('css');
              update();
              
        }//css
        
        
        btn.label   = function(){
        
              set.mode('label');
              update();
              
        }//laabel
        
        
  //:
  
  
        set.mode    = function(mode){
        
              ui.mode   = mode;
              
              var list    = $.all(shadow,'#hdr img');
              list.forEach(img=>{
              
                    if(img.id==mode){
                          img.classList.add('active');
                    }else{
                          img.classList.remove('active');
                    }
                    
              });
              
        }//mode
        
        
  //:
  
  
        obj.update    = update;
        
        function update(txt,type,mode){
        
              txt     ||= editor.getvalue();
              type    ||= editor.mode;
              mode    ||= ui.mode;
                                                                                debug('update',type,mode);
              var list;
              if(mode=='label'){
                    list    = update.label(txt,type);
              }else{
                    list    = update[mode](txt,type);
              }
              
              display(list);
              
        }//update
        
        
        update.label    = function(txt,type){
                                                                                debug('update.label');
              var list1   = update.fn(txt,type,true);
                                                                                //console.log(list1);
              var list2   = update.html(txt,type,true);
                                                                                //console.log(list2);
              var list3   = update.css(txt,type,true);
                                                                                //console.log(list3);
              var list    = merge(list1,list2,list3);
              return list;
              
        }//label
        
        
        function display(list){
        
              view.replaceChildren();
              
              if(list.length==0){
                    view.append(empty);
              }
              
              list.forEach(o=>{
              
                    var node;
                    
                    if(o.type.startsWith('fn'))node     = fn.create(o);
                    if(o.type.startsWith('css'))node    = css.create(o);
                    if(o.type.startsWith('html'))node   = html.create(o);
                    if(o.type.startsWith('test'))node   = update.test.create(o);
                    
                    view.append(node);
                    
              });
              
        }//display
        
        
  //:
  
  
        obj.clear   = clear;
        
        function clear(){
        
              view.replaceChildren();
              view.append(empty);
              
        }//clear
        
        
  //:
  
  
        update.test   = function(){
        
              var list    = [];
              for(var i=0;i<500;i++){
              
                    var o   = {type:'test',name:'test-'+i};
                    list.push(o);
                    
              }//for
              return list;
              
        }//test
        
        
        update.test.create    = function(o){
        
              var div   = document.createElement('div');
              div.textContent   = o.name;
              return div;
              
        }//create
        
        
  //:
  
  
        ctx.indent   = indent;
        
        function indent(txt,index){
        
              var i2        = txt.lastIndexOf('\n',index);
              if(i2==-1){
                    i2      = 0;
              }
              var i3        = txt.indexOf('\n',index);
              if(i3==-1){
                    i3      = txt.length;
              }
              var line      = txt.slice(i2+1,i3);
              var match     = line.match(/^\s*/);
              var indent    = match ? match[0].length : 0;
              return indent;
              
        }//indent
        
        
        ctx.lineno   = lineno;
        
        function lineno(txt,index){
        
              var start       = 0;
              var end         = index;
              var substring   = txt.slice(start,end);
              var newlines    = substring.match(/\r\n|\n|\r/g);
              var count       = newlines ? newlines.length : 0;
              count++;
              return count;
              
        }//line
        
        
        ctx.colno    = colno;
        
        function colno(txt,index){
        
              var i1        = txt.lastIndexOf('\n',index);
              if(i1==-1){
                    i1    = 0;
              }
              var col       = index-i1;
              return col;
              
        }//colno
        
        
        ctx.merge   = merge;
        
        function merge(...lists){
        
              var list    = lists.flat().sort((a,b)=>(a.index-b.index));
              return list;
              
        }//merge
        
        
  //:
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  return obj;
  
//code-explorer
})

      </script>
