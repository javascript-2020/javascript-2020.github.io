        parse.fn.type1   = function(txt,i1){

              var args      = parse.fn.args(txt,i1);
              var indent    = parse.fn.indent(txt,i1);
              
              return {index:i1,name,args,indent};
              
        }//type2
        
        
        parse.fn.args    = function(txt,i1){
        
              var i2      = txt.indexOf('(',i1);
              var i3      = txt.indexOf(')',i2);
              var args    = txt.slice(i2,i3+1);

              var regex     = /^[a-zA-Z_$][0-9a-zA-Z_$]*$/

        function lineno(txt,i){
        
              var start       = 0;
              var end         = i;
              var substring   = txt.slice(start,end);
              var newlines    = substring.match(/\r\n|\n|\r/g);
