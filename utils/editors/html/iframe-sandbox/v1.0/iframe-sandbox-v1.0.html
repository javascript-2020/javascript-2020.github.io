


<iframe-sandbox>

      <template shadowrootmode=open>
      
            <style>
            
  :host
    {display:grid;grid-template-columns:1fr 1fr}
    
  label
    {white-space:nowrap}
    
            </style>
            
            <span class=radio>
                  <input type=checkbox>
                  <label>
                  </label>
            </span>
            
      </template>
      
      <script>
      
(function({mod,host}){

  var obj   = {
        version   : 'v1.0',
  };
  
        var df=true,did='iframe-sandbox';
        
        var $
        ;
        
        obj.initmod   = function(...list){
        
              list.forEach(params=>{
              
                    $       = mod.rd(params,'$',$);
                    
              });
              
        }//initmod
        
        
  //:
  
  
  
        var values    = [
              'allow-downloads',
              'allow-forms',
              'allow-modals',
              'allow-orientation-lock',
              'allow-pointer-lock',
              'allow-popups',
              'allow-popups-to-escape-sandbox',
              'allow-presentation',
              'allow-same-origin',
              'allow-scripts',
              'allow-storage-access-by-user-activation',
              'allow-top-navigation',
              'allow-top-navigation-by-user-activation',
              'allow-top-navigation-to-custom-protocols'
        ];
        
        
        
        
        var chk   = {};
        
        
        
  //:
  
  
        obj.init    = async function(){
        }//init
        
        
  //:
  
  
        obj.initdom   = async function(){
        
              shadow    = host.shadowRoot;
              
              var item    = $(shadow,'.radio');
              item.remove();
              //debugger;
              values.forEach(value=>{
                                                                                //console.log(value);
                    var nitem                                 = item.cloneNode(true);
                    nitem.id                                  = value;
                    $(nitem,'label').textContent              = value;
                    $(nitem,'[type=checkbox]').checked        = (def.indexOf(value)!=-1)
                    shadow.append(nitem);
                    chk[value]                                = $.chkbox(shadow,`#${value}`,chk.click);
                    
              });
              
        }//initdom
        
        
  //:
  
  
        chk.click   = function(chk){
        }//click
        
        
  //:
  
  
  return obj;
  
//iframe-sandbox
})

      </script>
      
</template>
