


<iframe-sandbox class=menu-root>

      <template shadowrootmode=open>
      
            <style>
            
  :host
    {}
    
  .menu
    {position:absolute;left:30px;top:35px;
      display:flex;flex-direction:column;gap:10px
    }
    
  #list
    {flex:1;display:grid;grid-template-columns:1fr;gap:10px;overflow:auto}
    
  .radio
    {border:1px solid lightgray;padding:5px 10px;border-radius:5px;cursor:pointer;display:flex;align-items:center;gap:10px;
      white-space:nowrap;
    }
  .radio *
    {cursor:pointer}
    
  label
    {white-space:nowrap}
    
            </style>
            
            
            <!-- <div class=menu-root> -->
            
                  <input value=sandbox type=button>
                  
                  <div class=menu style='display:none;height:250px'>
                  
                        <div>
                              iframe sandbox
                        </div>
                        
                        <div id=list>
                              <span class=radio>
                                    <input type=checkbox>
                                    <label>
                                    </label>
                              </span>
                        </div>
                        
                  </div menu>
                  
            <!-- </div menu-root> -->
            
      </template>
      
      <script>
      
(function({mod,host}){

  var obj   = {
        version   : 'v1.0',
  };
  
        var df=true,did='iframe-sandbox';
        
        var $,def,menu,output
        ;
        
        obj.initmod   = function(...list){
        
              list.forEach(params=>{
              
                    $           = mod.rd(params,'$',$);
                    def         = mod.rd(params,'def',def);
                    menu        = mod.rd(params,'menu',menu);
                    output      = mod.rd(params,'output',output);
                    
              });
              
        }//initmod
        
        
  //:
  
  
  
        var values    = [
              'allow-downloads',
              'allow-forms',
              'allow-modals',
              'allow-orientation-lock',
              'allow-pointer-lock',
              'allow-popups',
              'allow-popups-to-escape-sandbox',
              'allow-presentation',
              'allow-same-origin',
              'allow-scripts',
              'allow-storage-access-by-user-activation',
              'allow-top-navigation',
              'allow-top-navigation-by-user-activation',
              'allow-top-navigation-to-custom-protocols'
        ];
        
        
        
        
        var chk   = {};
        
        
        
  //:
  
  
        obj.init    = async function(){
        }//init
        
        
  //:
  
  
        obj.initdom   = async function(){
        
              shadow          = host.shadowRoot;
              
              menu.add.style(shadow);
              
              
              var node                                        = $(shadow,'.menu');
              //var fn=menu.click(node,'both',false);
              $(shadow,'[value=sandbox]').onclick             = e=>menu.add.stack(node,'both',false);
              
              
              var list        = $(shadow,'#list');
              
              var item        = $(list,'.radio');
              item.remove();
              
              values.forEach(value=>{
                                                                                //console.log(value);
                    var nitem                                 = item.cloneNode(true);
                    nitem.id                                  = value;
                    $(nitem,'label').textContent              = value;
                    $(nitem,'[type=checkbox]').checked        = (def.indexOf(value)!=-1)
                    list.append(nitem);
                    chk[value]                                = $.chkbox(shadow,`#${value}`,chk.click);
                    
              });
              
              
        }//initdom
        
        
  //:
  
  
        chk.click   = function(chk){
                                                                                //console.log(chk);
              if(chk.id=='allow-modals'){
                    output.chk['allow-modals'].checked    = chk.checked;
              }
              if(chk.id=='allow-popups'){
                    output.chk['allow-popups'].checked    = chk.checked;
              }
              
        }//click
        
        
  //:
  
  
        obj.build   = function(){
        
              var attr    = '';
              values.forEach(value=>{
              
                    if(chk[value].checked){
                          attr   += value+' ';
                    }
                    
              });
                                                                                console.log(attr);
              return attr;
              
        }//build
        
        
  return obj;
  
//iframe-sandbox
})

      </script>
      
</template>
