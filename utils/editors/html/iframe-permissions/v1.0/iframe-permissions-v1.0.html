


<iframe-permissions class=menu-root>

      <template shadowrootmode=open>
      
            <style>
            
  :host
    {}
    
  [value=permissions]
    {flex:1}
    
  #preset
    {display:flex;gap:10px}
  #preset>input
    {flex:1}
    
  .menu
    {position:absolute;left:130px;top:-50px;width:380px;
      display:flex;flex-direction:column;gap:10px
    }
    
  #list
    {flex:1;display:grid;grid-template-columns:1fr;gap:10px;overflow:auto}
    
  .radio
    {border:1px solid lightgray;padding:5px 10px;border-radius:5px;cursor:pointer;display:flex;align-items:center;gap:10px;
      white-space:nowrap;
    }
  .radio *
    {cursor:pointer}
    
  label
    {white-space:nowrap}
    
    
  input
    {font-size:16px;padding:5px 10px}
  input[type]
    {cursor:pointer}
    
    
            </style>
            
            <input value=permissions type=button>
            
            <div class=menu style='display:none;height:350px'>
            
                  <div class=menu-title>
                        iframe permissions
                  </div>
                  
                  <div id=preset>
                        <input type=button>
                  </div>
                  
                  <div id=list>
                        <div class=radio>
                              <input type=checkbox>
                              <label>
                              </label>
                        </div>
                  </div>
                  
            </div menu>
            
      </template>
      
      <script>
      
(function({mod,host}){

  var obj   = {
        version   : 'v1.0',
  };
  
        var df=true,did='iframe-permissions';
        
        var $,debug,def,output
        ;
        
        obj.initmod   = function(...list){
        
              list.forEach(params=>{
              
                    $           = mod.rd(params,'$',$);
                    debug       = mod.rd(params,'debug',debug);
                    def         = mod.rd(params,'def',def);
                    output      = mod.rd(params,'output',output);
                    
              });
              
        }//initmod
        
        
  //:
  
  
        var values    = [
              'accelerometer',
              'ambient-light-sensor',
              'autoplay',
              'battery',
              'bluetooth',
              'browsing-topics',
              'camera',
              'captured-surface-control',
              'clipboard-read',
              'clipboard-write',
              'compute-pressure',
              'display-capture',
              'encrypted-media',
              'fullscreen',
              'gamepad',
              'geolocation',
              'gyroscope',
              'hid',
              'idle-detection',
              'local-fonts',
              'magnetometer',
              'microphone',
              'midi',
              'payment',
              'picture-in-picture',
              'publickey-credentials-get',
              'screen-wake-lock',
              'serial',
              'speaker-selection',
              'storage-access',
              'usb',
              'web-share',
              'window-management',
              'xr-spatial-tracking'
        ];
        
        
        var preset          = {};
        preset.min          = 'autoplay; encrypted-media; picture-in-picture;'
        preset.standard     = 'clipboard-write; clipboard-read; autoplay; encrypted-media; picture-in-picture; screen-wake-lock; web-share;';
        preset.app          = `clipboard-write; clipboard-read; camera; microphone; geolocation; accelerometer; gyroscope; magnetometer; payment; usb; serial;
                                bluetooth; xr-spatial-tracking; autoplay; encrypted-media; picture-in-picture; screen-wake-lock; web-share`;
        preset.all          = values.join('; ');
        
        
        
        
        var shadow;
        
        
        
        
        var chk   = {};
        var btn   = {};
        
        
  //:
  
  
        obj.init    = async function(){
        
              mod.initmod(obj);
                                                                                debug=eval(debug.mod);
                                                                                debug('init');
        }//init
        
        
  //:
  
  
        obj.initdom   = async function(){
                                                                                debug('initdom');
              shadow                                          = host.shadowRoot;
              
              menu.add.style(shadow);
              
              var node                                        = $(shadow,'.menu');
              $(shadow,'[value=permissions]').onclick         = e=>menu.add.stack(node,'both',false);
              
              var input                                       = $(shadow,'#preset input');
              input.remove();
              
              for(let key in preset){
              
                    var ninput                                = input.cloneNode(true);
                    ninput.value                              = key;
                    ninput.onclick                            = e=>btn.preset(key);
                    $(shadow,'#preset').append(ninput);
                    
              }//for
              
              
              var list                                        = $(shadow,'#list');
              
              var item                                        = $(list,'.radio');
              item.remove();
              
              values.forEach(value=>{
                                                                                //console.log(value);
                    var nitem                                 = item.cloneNode(true);
                    nitem.id                                  = value;
                    $(nitem,'label').textContent              = value;
                    $(nitem,'[type=checkbox]').checked        = (preset.min.indexOf(value)!=-1)
                    list.append(nitem);
                    chk[value]                                = $.chkbox(shadow,`#${value}`,chk.click);
                    
              });
              
        }//initdom
        
        
  //:
  
  
        btn.preset    = function(key){
        
              values.forEach(value=>{
              
                    chk[value].checked    = (preset[key].indexOf(value)!=-1)
                    
              });
              
        }//preset
        
        
        chk.click   = function(chk){
        }//click
        
  //:
  
  
        obj.build   = function(){
        
              var attr    = '';
              values.forEach(value=>{
              
                    if(chk[value].checked){
                          attr   += value+'; ';
                    }
                    
              });
                                                                                console.log(attr);
              return attr;
              
        }//build
        
        
        
        
        
  return obj;
  
//iframe-permissions
})

      </script>
      
</iframe-permissions>
