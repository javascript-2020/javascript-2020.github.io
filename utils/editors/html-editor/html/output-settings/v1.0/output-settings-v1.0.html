            <div class=menu-root style='display:block;height:34px'>

                  <div class=menu style='display:none;/*width:300px;height:200px;*/'>
                  
                        <div class=menu-title>
                              output menu
                        </div>
                        
                        <div class=menu-div>
                              console
                        </div>
                        
                        <span id=console class=radio>
                              <input type=checkbox checked>
                              console
                        </span>
                        
                        <span id=console-echo class=radio>
                              <input type=checkbox checked>
                              echo
                        </span>
                        
                        <div class=menu-div>
                              iframe
                        </div>

                              <input type=checkbox disabled>
                              isolate
                        </span>

                              <iframe-permissions v1.0 component=grp></iframe-permissions>

      </template>
      
      <script>
      
(function({mod,host}){

  var obj   = {
        version   : 'v1.0',
  };
  
        var df=true,did='output-settings';
        
        var $,debug,menu,output
        ;
        
        obj.initmod   = function(...list){
        
              list.forEach(params=>{
              
                    $           = mod.rd(params,'$',$);
                    debug       = mod.rd(params,'debug',debug);
                    menu        = mod.rd(params,'menu',menu);
                    output     = mod.rd(params,'output',output);
                    
              });
              
        }//initmod
        
        
  //:
  
  
        var sandbox;
        var permissions;
        
        
        var shadow;
        
        
        var chk               = {};
        obj.chk               = chk;
        
        
  //:
  
  
        obj.init    = async function(){
                                                                                debug=eval(debug.mod);
                                                                                debug('init');
              sandbox   = mod['iframe-sandbox'];
              sandbox.initmod({output});
              
              permissions   = mod['iframe-permissions'];
              permissions.initmod({output});
              
              await mod.auto();
              
              
        }//init
        
        
  //:
  
  
        obj.initdom   = async function(){
                                                                                debug('initdom');
              shadow                                    = host.shadowRoot;
              
              var style                                 = $(shadow,'style');
              $.stylesheet.copyrule('#page-inline','.icon',style);
              menu.add.style(shadow);
              
              var node                                  = $(shadow,'.menu');
              $(shadow,'#settings').onclick             = menu.click(node,'both',false);
              
              $.chkbox(shadow,'#console',output.console.show);
              chk['console-echo']                       = $.chkbox(shadow,'#console-echo');
              
        }//initdom
        
        
  //:
  
  
        obj.sandbox   = function(){
        
              var attr      = sandbox.build();
                                                                                debug(attr);
              return attr;
              
        }//allow
        
        
        obj.allow   = function(){
        
              var attr    = permissions.build();
                                                                                debug(attr);
              return attr;
              
        }//allow
        
        
  //:
  
  
  return obj;
  
//output-settings
})

      </script>
      
</output-setttings>
