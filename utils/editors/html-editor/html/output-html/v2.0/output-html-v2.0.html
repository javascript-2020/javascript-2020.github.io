

<output-html>

      <template shadowrootmode=open>
      
            <style>
            
  :host
    {display:flex;flex-direction:column;height:100%}
    
  #hdr
    {display:flex}
    
  .radio
    {border:1px solid lightgray;padding:2px 10px;border-radius:5px;cursor:pointer;display:flex;align-items:center}
    
  #isolate
    {margin-right:10px}
  #allow-scripts
    {color:gray}
  #console-clear
    {margin-right:20px}
    
  #hldr
    {flex:1;box-sizing:border-box;position:relative}
  iframe
    {width:100%;height:100%}
  #glass
    {position:absolute;left:0;top:0;width:100%;height:100%;display:none}
    
  #slider
    {height:10px;cursor:ns-resize}
    
  #kill
    {padding:5px 10px;min-width:60px}
    
            </style>
            
            <div id=hdr>
            
                  <output-settings v1.0 component=page>
                  </output-settings>
                  
                  <span id=allow-scripts class=radio>
                        <input type=checkbox checked disabled>
                        allow-scripts
                  </span>
                  
                  <div style='flex:1'></div>
                  
                  <span id=console-persist class=radio>
                        <input type=checkbox>
                        persist
                  </span>
                  <span id=console-clear class=radio>
                        clear
                  </span>
                  
                  <button id=kill>kill</button>
                  
            </div>
            
            
            <!--
            https://sandbox-ext-code-com-1024713184986.us-central1.run.app/html-sandbox/html-sandbox.html
            https://ext-code-test.com/html-sandbox/html-sandbox.html
            -->
            <div id=hldr>
                  <iframe></iframe>
            </div>
            
            <div id=slider></div>
            
            <web-console component h=150></web-console>
            
      </template>
      
      <script>
      
(function output_html({mod,dom,host}){

  var obj   = {
        version   : 'v2.0',
  };
        var df=false,did='output-html'
        ;
        
        
        
        var ext,$
        ;
        
        obj.initmod=function(params){
        
              ext   = mod.rd(params,'ext',ext);
              $     = mod.rd(params,'$',$);
              
        }//initmod
        
        
  //vars:-
  
  
        var webconsole;
        
        
        var chk   = {};
        
        var hldr;
        var iframe;
        var def_sandbox;
        
        
        var sandbox_url       = {};
        sandbox_url.type1     = 'https://sandbox.ext-code.com/html-sandbox-1/html-sandbox-1.html';
        sandbox_url.type2     = 'https://sandbox.ext-code.com/html-sandbox-2/html-sandbox-2.html';
        var sandbox_type      = 'type2';
        var iframe_src        = sandbox_url[sandbox_type];
        var iframe_sandbox    = 'allow-scripts allow-same-origin allow-forms allow-downloads allow-pointer-lock';//allow-popups-to-escape-sandbox
        var iframe_allow      = `clipboard-write; clipboard-read; camera; microphone; geolocation; accelerometer; gyroscope; magnetometer; payment; usb; serial; bluetooth;
                                  xr-spatial-tracking; autoplay; encrypted-media; picture-in-picture; screen-wake-lock; web-share`;
                                  
                                  
                                  
        var btn         = {};
        btn.console     = {};
        obj.on          = {};
        var create      = {};
        var build       = {};
        var run         = {};
        
        
  //:
  
  
        obj.init    = async function(){
        
              await mod.auto();
              
              webconsole    = mod['web-console'];
              
              
        }//init
        
        
  //:
  
  
        obj.initdom   = function(){
        
              shadow                                    = host.shadowRoot;
              
              var style                                 = $(shadow,'style');
              $.stylesheet.insert(style,'button','.icon');
              
              
              var hdr                                   = $(shadow,'#hdr');
              
              chk.isolate                               = $.chkbox(hdr,'#isolate');
              chk.isolate.checked                       = window.crossOriginIsolated;
              
              chk['allow-scripts']                      = $.chkbox(hdr,'#allow-scripts');
              chk['allow-modals']                       = $.chkbox(hdr,'#allow-modals');
              chk['allow-popups']                       = $.chkbox(hdr,'#allow-popups');
              
              chk['console-show']                       = $.chkbox(hdr,'#console-show',btn.console.show);
              chk['console-echo']                       = $.chkbox(hdr,'#console-echo');
              chk['console-persist']                    = $.chkbox(hdr,'#console-persist');
              $(shadow,'#console-clear').onclick        = btn.console.clear;
              
              $(hdr,'#kill').onclick                    = btn.kill;
              
              
              hldr                                      = $(shadow,'#hldr');
              iframe                                    = $(shadow,'iframe');
              
              
              $.slider(hldr,'#slider',webconsole.host,null,{root:shadow,mode:'horiz'});
              
              
              var src   = sandbox_url[sandbox_type];
              create.iframe({src});
              
              
        }//initdom
        
        
  //:
  
  
        btn.kill    = function(){
        
              kill();
              
        }//kill
        
/*
        btn.isolate   = function(chk){
        
              var url   = new URL(sandbox_url);
              if(chk.checked){
                    sanbox_url   += '?isolate';
              }else{
                    var i         = sandbox_url.indexOf('?');
                    sandbox_url   = sandbox_url.slice(0,i);
              }
              
        }//isolate
*/


        btn.console.show    = function(chk){
        
              if(chk.checked){
                    webconsole.host.style.display   = '';
              }else{
                    webconsole.host.style.display   = 'none';
              }
              
        }//show
        
        
        btn.console.clear   = function(){
        
              webconsole.clear();
              if(chk['console-echo'].checked){
                    console.clear();
              }
              
        }//clear
        
        
        
        obj.horiz   = function(){
        
              host.style.width     = '100%';
              host.style.height    = '50%';
              
        }//horiz
        
        
        obj.vert    = function(){
        
              host.style.width    = '50%';
              host.style.height   = '100%';
              
        }//vert
        
        
        
  //:
  
  
        obj.run   = function(html){
        
              switch(sandbox_type){
              
                case 'type1'    : sandbox1(html);       break;
                case 'type2'    : sandbox2(html);       break;
                
              }//switch
              
        }//run
        
        
        create.iframe   = function({src,onload}){
        
              iframe.remove();
              iframe    = iframe.cloneNode();
              
              //build.sandbox();
              var attr    = settings.sandbox();
              iframe.setAttribute('sandbox',attr);
              
              var attr    = settings.permissions();
              iframe.setAttribute('allow',attr);
              
              /*
              if(chk.isolate.checked){
                    src  += '?isolate';
              }
              iframe.src      = src;
              */
                                                                                debug(src);
              iframe.onload   = onload;
              hldr.append(iframe);
              
        }//iframe
        
/*
        build.sandbox   = function(){
        
              var attr      = iframe_sandbox;
                                                                                //console.log(attr);
              var tokens    = new Set(attr.split(/\s+/).filter(Boolean));
              
              if(!chk['allow-scripts'].checked){
                    tokens.delete('allow-scripts');
              }
              if(chk['allow-modals'].checked){
                    tokens.add('allow-modals');
              }
              if(chk['allow-popups'].checked){
                    tokens.add('allow-popups');
              }
              
              var attr      = [...tokens].join(' ');
                                                                                debug(attr);
              iframe.setAttribute('sandbox',attr);
              
        }//sandbox
*/


        function sandbox1(html){
                                                                                debug('sandbox1');
              var src   = iframe_src;
              create.iframe({src,onload});
              
              
              function onload(){
                                                                                debug('onload');
                    iframe.onload   = null;
                    
                    if(!chk['console-persist'].checked){
                          webconsole.clear();
                          if(chk['console-echo'].checked){
                                console.clear();
                          }
                    }
                    
                    var echo    = chk['console-echo'].checked;
                    iframe.contentWindow.postMessage({type:'run',html,echo},'*');
                    
              }//onload
              
        }//sandbox1
        
        
        async function sandbox2(html){
                                                                                debug('sandbox2');
              var resolve,promise=new Promise(res=>resolve=res);
              
              
              if(!chk['console-persist'].checked){
                    //clear();
              }
              
              var echo        = true;//settings.chk['console-echo'].checked;
              
              var fn          = await upload();
                                                                                debug(fn);
              var src         = sandbox_url.type2+`?fn=${fn}`;
              
              create.iframe({src,onload});
              
              return promise;
              
              
              async function upload(){
              
                    var {result,error}    = await send({type:'upload',html,echo});
                    if(error){
                          log.red(error);
                          return;
                    }
                    var fn    = result;
                    return fn;
                    
              }//upload
              
              
              async function onload(){
              
                    iframe.onload   = null;
                    iframe.contentWindow.focus();
                    
                    resolve();
                    
              }//onload
              
        }//sandbox2
        
        
        
        function srcdoc(html){
        
              iframe.remove();
              iframe    = iframe.cloneNode();
              
              build.sandbox();
              
              hldr.append(iframe);
              
              
              if(!chk['console-persist'].checked){
                    webconsole.clear();
                    if(chk['console-echo'].checked){
                          console.clear();
                    }
              }
              
              iframe.srcdoc   = html;
              
        }//srcdoc
        
        
        
  //:
  
  
        function send(payload){
        
              var resolve,promise=new Promise(res=>resolve=res);
              
              var msgid   = crypto.randomUUID();
              
              window.addEventListener('message',onmessage);
              iframe.contentWindow.postMessage({msgid,payload},'*');
              
              return promise;
              
              
              function onmessage(e){
              
                    if(e.data?.msgid!==msgid)return;
                    window.removeEventListener('message',onmessage);
                    var {result,error}    = e.data;
                    resolve({result,error});
                    
              }//onmessage
              
        }//send
        
        
  //:
  
  
  
/*
        obj.blob    = function(html){
        
              var blob=new Blob([html],{type:'text/html'});
              var url=URL.createObjectURL(blob);
              iframe.src=url;
              
        }//blob
*/

        obj.kill    = function(){return kill()}    //d
        
        function kill(){
        
              var niframe       = iframe.cloneNode(true);
              //niframe.srcdoc    = null;
              hldr.replaceChild(niframe,iframe);
              iframe            = niframe;
              
        }//kill
        
        
  //:
  
  
        obj.on.message    = function(json){
                                                                                console.log('output.message',json);
              var {name,args}   = json;
              webconsole[name].apply(null,args);
              
        }//message
        
        
  //:
  
  
        function debug(...args){
        
              if(!df && !obj.df)return;
              args.unshift(`[ ${did} ]`);
              var fmt     = Array.from({length:args.length}).fill('%O').join(' ');
              var args2   = [fmt].concat(args);
              console.groupCollapsed.apply(console,args2);
              console.trace();
              console.groupEnd();
              
        }//debug
        
        
        
        
  return obj;
  
})//output_html

      </script>
      
</output-html>
