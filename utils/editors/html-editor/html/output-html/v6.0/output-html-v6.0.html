

<output-html>

      <template shadowrootmode=open>
      
            <style>
            
  :host
    {display:flex;flex-direction:column;height:100%;overflow:auto}
    
  #hdr
    {display:flex;flex-wrap:wrap}
    
    
  #console-clear
    {/*margin-right:20px*/}

    {padding:5px 10px;min-width:60px}

    {flex:1;box-sizing:border-box;border:1px solid lightgray;position:relative}
  .loading
    {border-color:orange !important}
  #glass
    {position:absolute;left:0;right:0;top:0;bottom:0;z-index:1;background:hsla(195,53%,79%,0.05)}
  iframe
    {position:absolute;left:0;top:0;width:100%;height:100%;border:none}
    
    
  #slider
    {height:10px;cursor:ns-resize}
    
    
  web-console

  .radio:has([type=checkbox]:disabled)
    {color:gray;cursor:default}

    {cursor:default}
    
  input
    {font-size:16px;padding:5px 10px}
  input[type]
    {cursor:pointer}
  input[type=checkbox]
    {width:20px;height:20px}
    
            </style>
            
            <div id=hdr>
            
                  <output-settings v1.0 component=page></output-settings>
                  
                  <span id=allow-scripts class=radio>
                        <input type=checkbox checked>
                        allow-scripts
                  </span>
                  <span id=loopback-network class=radio>
                        <input type=checkbox checked>
                        loopback-network
                  </span>
                  
                  <div style='flex:1'></div>
                  
                  <span id=console-clear class=radio>
                        clear
                  </span>
                  <span id=console-persist class=radio>
                        <input type=checkbox>
                        persist
                  </span>
                  <span id=console-wrap class=radio>
                        <input type=checkbox>
                        wrap
                  </span>
                  
                  <button id=kill>kill</button>
                  
            </div>
            
            
            <div id=hldr>
                  <iframe></iframe>
                  <div id=glass style='display:none'></div>
            </div>
            
            <div id=slider></div>
            
            <web-console v3.0 component h=150></web-console>
            
            
      </template>
      
      
      <script>
      
(function({mod,host}){

  var obj   = {
        version   : 'v6.0',
  };
        var df=true,did='output-html';
        
        var ext,$,debug
        ;
        
        obj.initmod   = function(...list){
        
              list.forEach(params=>{
              
                    ext         = mod.rd(params,'ext',ext);
                    $           = mod.rd(params,'$',$);
                    debug       = mod.rd(params,'debug',debug);
                    
              });
              
        }//initmod
        
        
  //vars:-
  
  
        var webconsole;
        var settings;
        
        
        var control_url       = 'https://sandbox.ext-code.com/html-sandbox-v6.0/html-sandbox-control-v6.0.html';
        var sandbox_url       = 'https://sandbox.ext-code.com/html-sandbox-v6.0/html-sandbox-v6.0.html';
        
        
        
        var shadow;
        
        var proxy;
        var control;
        
        var hldr;
        var glass;
        var iframe;
        
        var chk         = {};
        obj.chk         = chk;
        
        var slider      = {};
        
        
        var btn         = {};
        btn.console     = {};
        var on          = {};
        obj.on          = on;
        var create      = {};
        obj.console     = {};
        var show        = {};
        obj.show        = show;
        var hide        = {};
        obj.hide        = hide;
        
        
  //:
  
  
        obj.init    = async function(){
                                                                                debug=eval(debug.mod);
                                                                                debug('init',obj.version);
                                                                                
              webconsole    = mod['web-console'];
              
              settings      = mod['output-settings'];
              settings.initmod({output:obj});
              
              
              
              await mod.auto();
              
              
        }//init
        
        
        function events(){
                                                                                debug('events');
                                                                                
/*

              proxy.contentWindow.addEventListener('message',event=>{
                                                                                //console.log(event);
                                                                                
                    if(event.source!==iframe.contentWindow)return;
                    
                    var data    = event.data;
                    if(data && data.source==='IFRAME_MOUSE_BRIDGE'){
                    
                          var rect            = proxy.getBoundingClientRect();
                          
                          var parentClientX   = rect.left+data.clientX;
                          var parentClientY   = rect.top+data.clientY;
                          var screenX         = window.screenX+parentClientX;
                          var screenY         = window.screenY+parentClientY;
                                                                                //console.log(`Event: ${data.eventType}`,{x:parentClientX,y:parentClientY,nativeEventData:data});
                          var event2          = new MouseEvent(data.eventType,{
                                bubbles       : true,
                                cancelable    : true,
                                composed      : true,
                                view          : window,
                                detail        : data.eventType === 'click' || data.eventType === 'dblclick' ? 1 : 0,
                                screenX       : screenX,
                                screenY       : screenY,
                                clientX       : parentClientX,
                                clientY       : parentClientY,
                                pageX         : data.pageX,
                                pageY         : data.pageY,
                                ctrlKey       : data.ctrlKey,
                                altKey        : data.altKey,
                                shiftKey      : data.shiftKey,
                                metaKey       : data.metaKey,
                                button        : data.button,
                                buttons       : data.buttons
                          });
                          
                          proxy.dispatchEvent(event2);
                          
                    }
                    
              });
              
              
              proxy.contentWindow.addEventListener('message',e=>on.message(e));
              
              
*/


              on.message    = function(json){
                                                                                //console.log('output.message',e);
                    //var json   = e.data;
                    
                    if(json.type=='console'){
                          var {name,html}   = json;
                          webconsole[name].display(html);
                    }
                    
              }//message
              
              
              
        }//events
        
        
  //:
  
  
        obj.initdom   = function(){
                                                                                debug('initdom');
              shadow                                    = host.shadowRoot;
              
              var style                                 = $(shadow,'style');
              $.stylesheet.insert(style,'button','.icon');
              
              
              var hdr                                   = $(shadow,'#hdr');
              
              chk['allow-scripts']                      = $.chkbox(hdr,'#allow-scripts',btn['allow-scripts']);
              chk['loopback-network']                   = $.chkbox(hdr,'#loopback-network',btn['loopback-network']);
              
              $(shadow,'#console-clear').onclick        = btn.console.clear;
              chk['console-persist']                    = $.chkbox(hdr,'#console-persist');
              //$.chkbox(shadow,'#console-wrap',btn.console.wrap)
              
              $(hdr,'#kill').onclick                    = btn.kill;
              
              
              hldr                                      = $(shadow,'#hldr');
              glass                                     = $(shadow,'#glass');
              ifame                                     = $(shadow,'iframe');
              
              
              $.slider(hldr,'#slider','web-console',slider,{root:shadow,mode:'horiz'});
              
              
              create.proxy();
              create.iframe({src:sandbox_url});
              
              
              events();
              
              
        }//initdom
        
        
  //:
  
  
        btn['allow-scripts']    = function(chk){
        
              settings.sandbox.chk['allow-scripts'].checked   = chk.checked;
              
        }//allow-scripts
        
        
        btn['loopback-network']   = function(chk){
        
              settings.allow.chk['loopback-network'].checked   = chk.checked;
              
        }//loopback-network
        
        
        btn.kill    = function(){
        
              kill();
              
        }//kill
        
        
/*
        btn.isolate   = function(chk){
        
              var url   = new URL(sandbox_url);
              if(chk.checked){
                    sanbox_url   += '?isolate';
              }else{
                    var i         = sandbox_url.indexOf('?');
                    sandbox_url   = sandbox_url.slice(0,i);
              }
              
        }//isolate
*/



        btn.console.clear   = function(){
        
              webconsole.clear();
              
              if(settings.chk['console-echo'].checked){
                    console.clear();
              }
              
        }//clear
        
        
        btn.console.wrap    = function(chk){
        
              if(chk.checked){
                    webconsole.style.whiteSpace   = 'pre-wrap';
              }else{
                    webconsole.style.whiteSpace   = 'no-wrap';
              }
              
        }//wrap
        
        
  //:
  
  
        slider.md   = function(e){
        
              show.glass();
              
        }//md
        
        
        slider.mu   = function(e){
        
              hide.glass();
              
        }//mu
        
        
        show.glass    = function(){
        
              glass.style.display   = '';
              
        }//show.glass
        
        
        hide.glass    = function(){
        
              glass.style.display   = 'none';
              
        }//hide.glass
        
        
  //:
  
  
        obj.console.show    = function(chk){
        
              if(chk.checked){
                    webconsole.host.style.display   = '';
              }else{
                    webconsole.host.style.display   = 'none';
              }
              
        }//show
        
        
        obj.horiz   = function(){
        
              host.style.width     = '100%';
              host.style.height    = '50%';
              
        }//horiz
        
        
        obj.vert    = function(){
        
              host.style.width    = '50%';
              host.style.height   = '100%';
              
        }//vert
        
        
        
  //:
  
  
        obj.run   = function(html){
        
              sandbox6(html);
              
        }//run
        
        
        create.proxy    = function(){
        
              var resolve,promise=new Promise(res=>resolve=res);
              
              proxy                 = document.createElement('iframe');
              proxy.style.display   = 'none';
              proxy.onload          = onload;
              shadow.append(proxy);
              
              return promise;
              
              
              function onload(){
              
                    control           = document.createElement('iframe');
                    control.src       = control_url;
                    console.onload    = onload;
                    proxy.contentDocument.body.append(control);
                    
                    
                    function onload(){
                    
                          resolve();
                          
                    }//onload
                    
              }//onload
              
              
        }//proxy
        
        
        create.iframe   = function({src,onload:ponload}={}){
                                                                                debug('create.iframe');
              if(iframe){
                    iframe.remove();
              }
              iframe    = document.createElement('iframe');
              
              
              var attr        = settings.build.sandbox();
              iframe.setAttribute('sandbox',attr);
              
              var attr        = settings.build.allow();
              iframe.setAttribute('allow',attr);
              
              hldr.classList.add('loading');
              
              
              var url         = new URL(src);
              
              if(settings.chk.isolate.checked){
                    url.searchParams.set('isolate','');
              }
                                                                                //  remove the ugly isolate= from query
              var search      = url.search.replace(/=(?=&|$)/g,'');
              
              src             = url.origin+url.pathname+search+url.hash;
                                                                                debug(src);
              iframe.src      = src;
              
              iframe.onload   = onload;
              hldr.append(iframe);
              
              
              function onload(){
              
                    hldr.classList.remove('loading');
                    
                    iframe.onload   = null;
                    
                    if(typeof ponload=='function'){
                          ponload();
                    }
                    
              }//onload
              
        }//iframe
        
        
        async function sandbox6(html){
                                                                                debug('sandbox6');
              var resolve,promise=new Promise(res=>resolve=res);
              
              
              if(!chk['console-persist'].checked){
                    btn.console.clear();
              }
              var echo        = settings.chk['console-echo'].checked;
              
              
              var fn          = await upload(html,echo);
                                                                                //debug(fn);
              var src         = sandbox_url+`?fn=${fn}`;
                                                                                debug(src);
              create.iframe({src,onload});
              
              
              return promise;
              
              
              async function onload(){
                                                                                debug('onload');
                    iframe.contentWindow.focus();
                    
                    resolve();
                    
              }//onload
              
        }//sandbox5
        
        
        async function upload(html,echo){
                                                                                debug('upload');
              var {result,error}    = await send({type:'upload',html,echo});
              if(error){
                                                                                debug(error);
                    log.red(error);
                    return;
              }
                                                                                debug('ok');
              var fn    = result;
              return fn;
              
        }//upload
        
        
        function send(payload){
        
              var resolve,promise=new Promise(res=>resolve=res);
              
              var msgid   = crypto.randomUUID();
              
              proxy.contentWindow.addEventListener('message',onmessage);
              control.contentWindow.postMessage({msgid,payload},'*');
              
              return promise;
              
              
              function onmessage(e){
              
                    if(e.data?.msgid!==msgid)return;
                    proxy.contentWindow.removeEventListener('message',onmessage);
                    var {result,error}    = e.data;
                    resolve({result,error});
                    
              }//onmessage
              
        }//send
        
        
  //:
  
  
        function srcdoc(html){
        
              iframe.remove();
              iframe    = iframe.cloneNode();
              
              build.sandbox();
              
              hldr.append(iframe);
              
              
              if(!chk['console-persist'].checked){
                    webconsole.clear();
                    if(chk['console-echo'].checked){
                          console.clear();
                    }
              }
              
              iframe.srcdoc   = html;
              
        }//srcdoc
        
        
        
        
  //:
  
  
  
/*
        obj.blob    = function(html){
        
              var blob=new Blob([html],{type:'text/html'});
              var url=URL.createObjectURL(blob);
              iframe.src=url;
              
        }//blob
*/



        obj.kill    = function(){return kill()}    //d
        
        function kill(){
        
              create.iframe();
              
        }//kill
        
        
  //:
  
  
  
  return obj;
  
//output_html
})

      </script>
      
</output-html>
