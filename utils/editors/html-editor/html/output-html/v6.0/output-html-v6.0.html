

<output-html>

      <template shadowrootmode=open>
      
            <style>
            
  :host
    {display:flex;flex-direction:column;height:100%;overflow:auto}
    
  #hdr
    {display:flex;flex-wrap:wrap}
    
    
  #console-clear
    {/*margin-right:20px*/}
    
    
    
  #kill
    {padding:5px 10px;min-width:60px}
    
    
    
  #hldr
    {flex:1;box-sizing:border-box;border:1px solid lightgray;position:relative}
  .loading
    {border-color:orange !important}
  #glass
    {position:absolute;left:0;right:0;top:0;bottom:0;z-index:1;background:hsla(195,53%,79%,0.05)}
  iframe
    {position:absolute;left:0;top:0;width:100%;height:100%;border:none}
    
    
  #slider
    {height:10px;cursor:ns-resize}
    
  web-console
    {height:200px;border:1px solid lightgray;padding:5px;box-sizing:border-box}
    
    
  .radio
    {border:1px solid lightgray;padding:2px 5px;border-radius:5px;cursor:pointer;display:flex;align-items:center;gap:10px}
  .radio>*
    {cursor:pointer}
  .radio:has([type=checkbox]:disabled)
    {color:gray;cursor:default}
  .radio:has([type=checkbox]:disabled)>*
    {cursor:default}
    
  .spc {flex:1}
  
  input
    {font-size:16px;padding:5px 10px}
  input[type]
    {cursor:pointer}
  input[type=checkbox]
    {width:20px;height:20px}
    
            </style>
            
            <style sandbox-proxy>
            
  iframe
    {position:absolute;left:0;top:0;width:100%;height:100%;border:none}
    
            </style>
            
            <div id=hdr>
            
                  <output-settings v1.0 component=page></output-settings>
                  
                  <span id=allow-scripts class=radio>
                        <input type=checkbox checked>
                        allow-scripts
                  </span>
                  <span id=loopback-network class=radio>
                        <input type=checkbox>
                        loopback-network
                  </span>
                  
                  <div class=spc></div>
                  
                  <button id=kill>kill</button>
                  
            </div>
            
            
            <div id=hldr>
                  <iframe sandbox-proxy></iframe>
                  <div id=glass style='display:none'></div>
            </div>
            
            <div id=slider></div>
            
            <web-console v3.0 component h='auto'></web-console>
            
            
      </template>
      
      
      <script>
      
(function({mod,host}){

  var obj   = {
        version   : 'v6.0',
  };
        var df=true,did='output-html';
        
        var ext,$,debug
        ;
        
        obj.initmod   = function(...list){
        
              list.forEach(params=>{
              
                    ext         = mod.rd(params,'ext',ext);
                    $           = mod.rd(params,'$',$);
                    debug       = mod.rd(params,'debug',debug);
                    
              });
              
        }//initmod
        
        
  //vars:-
  
  
        var webconsole;
        var settings;
        
        
        var control_url       = 'https://sandbox.ext-code.com/html-sandbox-v6.0/html-sandbox-control-v6.0.html';
        var sandbox_url       = 'https://sandbox.ext-code.com/html-sandbox-v6.0/html-sandbox-v6.0.html';
        
        
        var control           = {};
        var sandbox           = {};
        
        
        var shadow;
        
        var root              = {};
        
        var hldr;
        var glass;
        
        var chk         = {};
        obj.chk         = chk;
        
        
        var btn         = {};
        btn.console     = {};
        var on          = {};
        obj.on          = on;
        var show        = {};
        obj.show        = show;
        var hide        = {};
        obj.hide        = hide;
        
        
  //:
  
  
        obj.init    = async function(){
                                                                                debug=eval(debug.mod);
                                                                                debug('init',obj.version);
                                                                                
              webconsole          = mod['web-console'];
              obj.webconsole      = webconsole;
              
              settings            = mod['output-settings'];
              obj.settings        = settings;
              settings.initmod({output:obj});
              
              
              await mod.auto();
              
              
        }//init
        
        
        function events(){
                                                                                debug('events');
                                                                                
/*

              proxy.contentWindow.addEventListener('message',event=>{
                                                                                //console.log(event);
                                                                                
                    if(event.source!==iframe.contentWindow)return;
                    
                    var data    = event.data;
                    if(data && data.source==='IFRAME_MOUSE_BRIDGE'){
                    
                          var rect            = proxy.getBoundingClientRect();
                          
                          var parentClientX   = rect.left+data.clientX;
                          var parentClientY   = rect.top+data.clientY;
                          var screenX         = window.screenX+parentClientX;
                          var screenY         = window.screenY+parentClientY;
                                                                                //console.log(`Event: ${data.eventType}`,{x:parentClientX,y:parentClientY,nativeEventData:data});
                          var event2          = new MouseEvent(data.eventType,{
                                bubbles       : true,
                                cancelable    : true,
                                composed      : true,
                                view          : window,
                                detail        : data.eventType === 'click' || data.eventType === 'dblclick' ? 1 : 0,
                                screenX       : screenX,
                                screenY       : screenY,
                                clientX       : parentClientX,
                                clientY       : parentClientY,
                                pageX         : data.pageX,
                                pageY         : data.pageY,
                                ctrlKey       : data.ctrlKey,
                                altKey        : data.altKey,
                                shiftKey      : data.shiftKey,
                                metaKey       : data.metaKey,
                                button        : data.button,
                                buttons       : data.buttons
                          });
                          
                          proxy.dispatchEvent(event2);
                          
                    }
                    
              });
              
              
*/

              sandbox.proxy.contentWindow.addEventListener('message',e=>on.message(e));
              
              on.message    = function(e){
                                                                                //console.log('output.message',e);
                    var json   = e.data;
                    
                    if(json.type==='console'){
                          var {name,html}   = json;
                          webconsole[name].display(html);
                    }
                    
              }//message
              
              
              
        }//events
        
        
  //:
  
  
        obj.initdom   = function(){
                                                                                debug('initdom');
              shadow                                    = host.shadowRoot;
              
              var style                                 = $(shadow,'style');
              $.stylesheet.insert(style,'button','.icon');
              
              
              var hdr                                   = $(shadow,'#hdr');
              
              chk['allow-scripts']                      = $.chkbox(hdr,'#allow-scripts',btn['allow-scripts']);
              chk['loopback-network']                   = $.chkbox(hdr,'#loopback-network',btn['loopback-network']);
              
              $(hdr,'#kill').onclick                    = btn.kill;
              
              
              hldr                                      = $(shadow,'#hldr');
              glass                                     = $(shadow,'#glass');
              
              sandbox.proxy                             = $(shadow,'iframe');
              var style                                 = $(shadow,'style[sandbox-proxy]');
              sandbox.proxy.contentDocument.head.append(style);
              
              control.create();
              sandbox.create();
              
              events();
              
              
              $.slider(hldr,'#slider','web-console',{md:show.glass,mu:hide.glass},{root:shadow,mode:'horiz'});
              
              
              $(shadow,'#console-clear').onclick        = btn.console.clear;
              chk['console-persist']                    = $.chkbox(shadow,'#console-persist');
              $.chkbox(shadow,'#console-wrap',btn.console.wrap)
              
              
              settings.allow.set.preset('standard');
              settings.sandbox.set.preset('standard');
              
              
        }//initdom
        
        
  //:
  
  
        btn['allow-scripts']    = function(chk){
        
              settings.sandbox.chk['allow-scripts'].checked   = chk.checked;
              
        }//allow-scripts
        
        
        btn['loopback-network']   = function(chk){
        
              settings.allow.chk['loopback-network'].checked   = chk.checked;
              
        }//loopback-network
        
        
        btn.kill    = function(){
        
              kill();
              
        }//kill
        
        
        btn.console.clear   = function(){
        
              webconsole.clear();
              
              if(settings.chk['console-echo'].checked){
                    console.clear();
              }
              
        }//clear
        
        
        btn.console.wrap    = function(chk){
        
              if(chk.checked){
                    webconsole.style.whiteSpace   = 'pre-wrap';
              }else{
                    webconsole.style.whiteSpace   = 'no-wrap';
              }
              
        }//wrap
        
        
  //:
  
  
        show.glass    = function(){
        
              glass.style.display   = '';
              
        }//show.glass
        
        
        hide.glass    = function(){
        
              glass.style.display   = 'none';
              
        }//hide.glass
        
        
  //:
  
  
        show.webconsole    = function(chk){
        
              if(chk.checked){
                    webconsole.host.style.display   = '';
              }else{
                    webconsole.host.style.display   = 'none';
              }
              
        }//show
        
        
        obj.horiz   = function(){
        
              host.style.width     = '100%';
              host.style.height    = '50%';
              
        }//horiz
        
        
        obj.vert    = function(){
        
              host.style.width    = '50%';
              host.style.height   = '100%';
              
        }//vert
        
        
  //:
  
  
        obj.run   = async function(html){
                                                                                debug('run');
              var resolve,promise=new Promise(res=>resolve=res);
              
              hldr.classList.add('loading');
              
              if(!chk['console-persist'].checked){
                    btn.console.clear();
              }
              var echo        = settings.chk['console-echo'].checked;
              
              
              var {fn,error}    = await control.upload(html,echo);
              if(error)return;
              
              sandbox.create({fn,onload});
              
              return promise;
              
              
              async function onload(){
                                                                                debug('run.onload');
                    hldr.classList.remove('loading');
                    
                    resolve();
                    
              }//onload
              
        }//run
        
        
  //:
  
  
        control.create    = function(){
                                                                                debug('control.create');
              var resolve,promise=new Promise(res=>resolve=res);
              
              if(control.proxy){
                    control.proxy.remove();
              }
              control.proxy                 = document.createElement('iframe');
              control.proxy.style.display   = 'none';
              control.proxy.toggleAttribute('control-proxy',true);
              control.proxy.onload          = onload;
              shadow.append(control.proxy);
              
              return promise;
              
              
              function onload(){
                                                                                debug('control.proxy onload');
                    var url           = new URL(control_url);
                    
                    if(settings.chk.isolate.checked){
                          url.searchParams.set('isolate','');
                    }
                                                                                //  remove the ugly isolate= from query
                    var search        = url.search.replace(/=(?=&|$)/g,'');
                    var src           = url.origin+url.pathname+search+url.hash;
                                                                                debug('src');
                    control.iframe           = document.createElement('iframe');
                    control.iframe.src       = src;
                    control.iframe.toggleAttribute('control-iframe',true);
                    control.iframe.onload    = onload;
                    control.proxy.contentDocument.body.append(control.iframe);
                    
                    
                    function onload(){
                                                                                debug('control.iframe onload');
                          resolve();
                          
                    }//onload
                    
              }//onload
              
        }//proxy
        
        
        control.upload    = async function(html,echo){
                                                                                debug('control.upload');
              var {result,error}    = await control.send({type:'upload',html,echo});
              if(error){
                                                                                debug(error);
                    log.red(error);
                    return {error};
              }
              var fn    = result;
                                                                                debug('ok',fn);
              return {fn};
              
        }//upload
        
        
        control.send    = function(payload){
        
              var resolve,promise=new Promise(res=>resolve=res);
              
              var msgid   = crypto.randomUUID();
              
              control.proxy.contentWindow.addEventListener('message',onmessage);
              control.iframe.contentWindow.postMessage({msgid,payload},'*');
              
              return promise;
              
              
              function onmessage(e){
              
                    if(e.data?.msgid!==msgid)return;
                    control.proxy.contentWindow.removeEventListener('message',onmessage);
                    var {result,error}    = e.data;
                    resolve({result,error});
                    
              }//onmessage
              
        }//send
        
        
  //:
  
  
        sandbox.create   = function({fn,onload}={}){
                                                                                debug('sandbox.create');
              if(sandbox.iframe){
                    sandbox.iframe.remove();
              }
              sandbox.iframe    = document.createElement('iframe');
              
              
              var attr        = settings.build.sandbox();
              sandbox.iframe.setAttribute('sandbox',attr);
              
              var attr        = settings.build.allow();
              sandbox.iframe.setAttribute('allow',attr);
              
              /*
              var flag        = settings.chk.credentialless.checked;
                                                                                debug('credentialless',flag);
              iframe.toggleAttribute('credentialless',flag);
              */
              
              
              var url                   = new URL(sandbox_url);
              
              if(fn){
                    url.searchParams.set('fn',fn);
              }
              if(settings.chk.isolate.checked){
                    url.searchParams.set('isolate','');
              }
                                                                                //  remove the ugly isolate= from query
              var search                = url.search.replace(/=(?=&|$)/g,'');
              var src                   = url.origin+url.pathname+search+url.hash;
                                                                                debug(src);
              sandbox.iframe.src        = src;
              sandbox.iframe.onload     = iframe_onload;
              
              sandbox.proxy.contentDocument.body.append(sandbox.iframe);
              
              
              function iframe_onload(){
                                                                                debug('sandbox.iframe onload');
                    sandbox.iframe.onload   = null;
                    sandbox.iframe.contentWindow.focus();
                    
                    if(typeof onload=='function'){
                          onload();
                    }
                    
              }//onload
              
        }//output
        
        
  //:
  
  
        function srcdoc(html){
        
              iframe.remove();
              iframe    = iframe.cloneNode();
              
              build.sandbox();
              
              hldr.append(iframe);
              
              
              if(!chk['console-persist'].checked){
                    webconsole.clear();
                    if(chk['console-echo'].checked){
                          console.clear();
                    }
              }
              
              iframe.srcdoc   = html;
              
        }//srcdoc
        
        
        
        
  //:
  
  
  
/*
        obj.blob    = function(html){
        
              var blob=new Blob([html],{type:'text/html'});
              var url=URL.createObjectURL(blob);
              iframe.src=url;
              
        }//blob
*/



        obj.kill    = function(){return kill()}    //d
        
        function kill(){
                                                                                debug('kill');
              sandbox.iframe();
              
        }//kill
        
        
  //:
  
  
  
  return obj;
  
//output_html
})

      </script>
      
</output-html>
