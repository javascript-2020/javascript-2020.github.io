<prompt-settings>

      <template shadowrootmode=open>
      
            <style>
            
  :host
    {transition:0.1s;height:100px}
    
            </style>
            
            
      </template>
      
      <range-element id=temperature component=page></range-element>
      
      <script>
      
(function({mod,host}){

  var obj   = {

  };
  
        var df=true,did='prompt-settings';
        
        var $,debug
        ;

                    debug   = mod.rd(params,'debug',debug);
                    
              });
              
        }//initmod
        
        
  //vars:
  
  
        var shadow;
        
        var temperature;
        
        
/*
        temperature       : 0.3,
        top_p             : 0.8,
        top_k             : 20,
        min_p             : 0.0,
        repeat_penalty    : 1.0,
        
        //max_tokens        : maxTokens,
*/

  //:
  
  
        obj.init    = async function(){
                                                                                debug=eval(debug.mod);
                                                                                debug('init');
              await mod.auto();
              
              temperature   = mod.temperature;
              
              
        }//init
        
        
  //:
  
  
        obj.initdom   = async function(){
        
              shadow        = host.shadowRoot;
              
              
        }//initdom
        
        
  //:
  
  
        obj.show    = function(){
        
              host.style.height   = 'auto';
              
        }//show
        
        
        obj.hide    = function(){
        
              host.style.height   = '';
              
        }//hide
        
        
        obj.read    = function(){
        }//read
        
        
  //:
  
return obj;

//prompt-settings
})

      </script>
      
</prompt-settings>
