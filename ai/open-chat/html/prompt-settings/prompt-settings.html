<prompt-settings>

      <template shadowrootmode=open>
      
            <style>
            
  :host
    {transition:0.1s;height:0;overflow:hidden;border:1px solid lightgray;padding:10px;border-radius:6px;
      interpolate-size: allow-keywords;}
      
            </style>
            
            
            
            <range-element id=temperature component=page></range-element>
            
            
      </template>
      
      <script>
      
(function({mod,host}){

  var obj   = {
        version   : 'v1.0',
  };
  
        var df=true,did='prompt-settings';
        
        var $,debug
        ;
        
        obj.initmod   = function(...list){
        
              list.forEach(params=>{
              
                    $       = mod.rd(params,'$',$);
                    debug   = mod.rd(params,'debug',debug);
                    
              });
              
        }//initmod
        
        
  //vars:
  
        var status    = false;
        
        var shadow;
        
        var temperature;
        
        
/*
        temperature       : 0.3,
        top_p             : 0.8,
        top_k             : 20,
        min_p             : 0.0,
        repeat_penalty    : 1.0,
        
        //max_tokens        : maxTokens,
*/

  //:
  
  
        obj.init    = async function(){
                                                                                debug=eval(debug.mod);
                                                                                debug('init');
              await mod.auto();
              
              temperature   = mod.temperature;
              temperature.create({name:'temperature',min:0,max:1,step:0.1,value:0.5});
              
              
        }//init
        
        
  //:
  
  
        obj.initdom   = async function(){
        
              shadow        = host.shadowRoot;
              
              
        }//initdom
        
        
  //:
  
  
        obj.toggle    = function(){
        
              if(status){
                    hide();
              }else{
                    show();
              }
              
        }//toggle
        
        
        obj.show    = show;
        
        function show(){
        
              status    = true;
              host.style.height   = 'auto';
              
        }//show
        
        
        obj.hide    = hide;
        
        function hide(){
        
              status    = false;
              host.style.height   = '';
              
        }//hide
        
        
        obj.read    = function(){
        }//read
        
        
  //:
  
return obj;

//prompt-settings
})

      </script>
      
</prompt-settings>
