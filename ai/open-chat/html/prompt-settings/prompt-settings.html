<prompt-settings>

      <template shadowrootmode=open>
      
            <style>
            
  :host
    {height:0;overflow:hidden;border:1px solid lightgray;padding:0px;border-radius:6px;
      interpolate-size: allow-keywords;box-sizing:border-box;display:block;transition:height 0.1s;}
      
            </style>
            
            
            
            <range-element id=temperature component=page value=0.3 style='flex-direction:row'></range-element>
            <range-element id=top_p component=page value=0.8 style='flex-direction:row'></range-element>
            <range-element id=min_p component=page value=0.0 style='flex-direction:row'></range-element>
            <range-element id=repeat_penalty component=page value=1.0 style='flex-direction:row'></range-element>
            <range-element id=top_k component=page max=40 value=20 step=1 style='flex-direction:row'></range-element>
            
            
            
      </template>
      
      <script>
      
(function({mod,host}){

  var obj   = {
        version   : 'v1.0',
  };
  
        var df=true,did='prompt-settings';
        
        var $,debug
        ;
        
        obj.initmod   = function(...list){
        
              list.forEach(params=>{
              
                    $       = mod.rd(params,'$',$);
                    debug   = mod.rd(params,'debug',debug);
                    
              });
              
        }//initmod
        
        
  //vars:
  
        var status    = false;
        
        var shadow;
        
        var props   = ['temperature','top_p','top_k','min_p','repeat_penalty'];
        
        //var temperature;
        
        
/*
        temperature       : 0.3,
        top_p             : 0.8,
        top_k             : 20,
        min_p             : 0.0,
        repeat_penalty    : 1.0,
        
        //max_tokens        : maxTokens,
*/

  //:
  
  
        obj.init    = async function(){
                                                                                debug=eval(debug.mod);
                                                                                debug('init');
              await mod.auto();
              
              //temperature   = mod.temperature;
              //temperature.create({name:'temperature'});
              
              
        }//init
        
        
  //:
  
  
        obj.initdom   = async function(){
        
              shadow        = host.shadowRoot;
              
              
        }//initdom
        
        
  //:
  
  
        obj.toggle    = function(){
        
              if(status){
                    hide();
              }else{
                    show();
              }
              
        }//toggle
        
        
        obj.show    = show;
        
        function show(){
        
              status    = true;
              host.style.height     = 'auto';
              host.style.padding    = '10px';
              
        }//show
        
        
        obj.hide    = hide;
        
        function hide(){
        
              status    = false;
              host.style.height     = '';
              host.style.padding    = 0;
              
        }//hide
        
        
        obj.read    = function(){
        }//read
        
        
  //:
  
return obj;

//prompt-settings
})

      </script>
      
</prompt-settings>
