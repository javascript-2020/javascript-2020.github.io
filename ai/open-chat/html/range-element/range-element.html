<range-element>

      <template shadowrootmode=open>
      
            <style>
            
  :host
    {display:inline-flex;flex-direction:column}
    
  #value-root
    {display:flex;gap:10px}
    
  [type=range]
    {width:100px}
    
  #value
    {width:50px}
    
  input
    {/*font-size:16px;padding:5px 10px;*/box-sizing:border-box}
  input[type=button]
    {cursor:pointer}
    
            </style>
            
            
            <label>
            </label>
            
            <div id=value-root>
                  <input type=button value=->
                  <input type=range min=0 max=1 step=0.1>
                  <input type=button value=+>
                  <input id=value>
            </div>
            
      </template>
      
      <script>
      
(function({mod,host}){

  var obj   = {
        version   : 'v1.0',
  };
  
        var df=true,did='range-element';
        
        var $,debug
        ;
        
        obj.initmod   = function(...list){
        
              list.forEach(params=>{
              
                    $       = mod.rd(params,'$',$);
                    debug   = mod.rd(params,'debug',debug);
                    
              });
              
        }//initmod
        
        
  //vars:
  
  
        var shadow;
        var range;
        var value;
        
        var on    = {};
        var btn   = {};
        
  //:
  
  
        obj.init    = async function(){
                                                                                debug=eval(debug.mod);
                                                                                debug('init');
        }//init
        
        
  //:
  
  
        obj.initdom   = async function(){
        
              shadow    = host.shadowRoot;
              
              range                               = $(shadow,'[type=range]');
              range.oninput                       = on.input;
              
              $(shadow,'[value=-]').onclick       = btn.dec;
              $(shadow,'[value=+]').onclick       = btn.inc;
              
        }//initdom
        
        
        on.input    = function(){
        
              var v         = range.value;
              value.value   = v;
              
        }//input
        
        
        btn.dec   = function(){
        }//dec
        
        
        btn.inc   = function(){
        }//inc
        
        
  //:
  
  
        obj.create    = function({name}){
        
              $(shadow,'label').textContent       = name;
              
              
              
              
              
        }//create
        
        
        obj.read    = function(){
        
              var v   = value.value;
              return v;
              
        }//read
        
        
  //:
  
  return obj;
  
//range-element
})

      </script>
      
</range-element>
