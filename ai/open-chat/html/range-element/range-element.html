<range-element>

      <template shadowrootmode=open>
      
            <style>
            
  :host
    {display:inline-flex;flex-direction:column;gap:5px;
      border:1px solid lightgray;padding:5px;border-radius:6px;
    }
    
  #hdr
    {display:flex;align-items:center;gap:10px}
    
  #name
    {cursor:pointer}
    
  #value-root
    {display:flex;gap:10px}
    
  [type=range]
    {width:100px}
    
  #value
    {width:50px}
    
  input
    {/*font-size:16px;padding:5px 10px;*/box-sizing:border-box}
  input[type=button]
    {cursor:pointer}
  [type=checkbox]
    {width:18px;height:18px;margin:0;cursor:pointer}
    
            </style>
            
            <div id=hdr>
                  <input id=enabled type=checkbox>
                  <label id=name for=enabled>
                  </label>
            </div>
            
            <div id=value-root>
                  <input type=button value=->
                  <input type=range min=0 max=1 step=0.1>
                  <input type=button value=+>
                  <input id=value>
            </div>
            
      </template>
      
      <script>
      
(function({mod,host}){

  var obj   = {
        version   : 'v1.0',
  };
  
        var df=true,did='range-element';
        
        var $,debug
        ;
        
        obj.initmod   = function(...list){
        
              list.forEach(params=>{
              
                    $       = mod.rd(params,'$',$);
                    debug   = mod.rd(params,'debug',debug);
                    
              });
              
        }//initmod
        
        
  //vars:
  
  
        var shadow;
        
        var chk;
        var range;
        var value;
        var min         = 0;
        var max         = 1;
        var step        = 0.1;
        
        var on    = {};
        on.input    = {};
        var btn   = {};
        
  //:
  
  
        obj.init    = async function(){
                                                                                debug=eval(debug.mod);
                                                                                debug('init');
        }//init
        
        
  //:
  
  
        obj.initdom   = async function(){
        
        
              if(host.hasAttribute('min')){
                    min   = Number(host.getAttribute('min'));
              }
              if(host.hasAttribute('max')){
                    max   = Number(host.getAttribute('max'));
              }
              if(host.hasAttribute('step')){
                    step   = Number(host.getAttribute('step'));
              }
              var v   = null;
              if(host.hasAttribute('value')){
                    v   = Number(host.getAttribute('value'));
              }
              var checked   = false;
              if(host.hasAttribute('checked')){
                    checked   = true;
              }
              
              
              shadow                              = host.shadowRoot;
              
              
              chk                                 = $(shadow,'[type=checkbox]');
              chk.checked                         = checked;
              
              label                               = $(shadow,'#name');
              var txt                             = get_text(host);
              if(!txt){
                    txt   = host.id;
              }
              if(txt){
                    label.textContent             = txt;
              }
              
              range                               = $(shadow,'[type=range]');
              range.oninput                       = on.input.range;
              if(v!==null){
                    range.value                   = v;
              }
              
              $(shadow,'[value="-"]').onclick       = btn.dec;
              
              value                               = $(shadow,'#value');
              value.oninput                       = on.input.value;
              if(v!==null){
                    value.value                   = v;
              }
              
              $(shadow,'[value="+"]').onclick       = btn.inc;
              
              
        }//initdom
        
        
        on.input.range    = function(){
        
              var v         = range.value;
              value.value   = v;
              
        }//range
        
        
        on.input.value    = function(){
        
              var v         = value.value;
              range.value   = Number(v).toFixed(1);
              
        }//value
        
        
        btn.dec   = function(){
        
              var v         = Number(value.value);
              v            -= step;
              value.value   = v.toFixed(1);
              range.value   = v.toFixed(1);
              
        }//dec
        
        
        btn.inc   = function(){
        
              var v   = Number(value.value);
              v            += step;
              value.value   = v.toFixed(1);
              range.value   = v.toFixed(1);
              
        }//inc
        
        
  //:
  
  
        obj.create    = function(params){
        
              if('min' in params){
                    min   = params.min;
              }
              if('max' in params){
                    max   = params.max;
              }
              if('step' in params){
                    step    = params.step;
              }
              if('value' in params){
                    var v         = params.value;
                    value.value   = v;
                    range.value   = v;
              }
              if('checked' in params){
                    chk.checked   = params.checked;
              }
              if('name' in params){
                    label.textContent     = params.name;
              }
              
              
        }//create
        
        
        obj.read    = function(){
        
              var v         = Number(value.value);
              var enabled   = chk.checked;
              return {enabled,value:v};
              
        }//read
        
        
  //:
  
  
        function get_text(node){
        
              var txt   = [...node.childNodes].filter(node=>node.nodeType==Node.TEXT_NODE).map(node => node.textContent).join('').trim();
              return txt;
              
        }//get_text
        
        
  //:
  
  return obj;
  
//range-element
})

      </script>
      
</range-element>
