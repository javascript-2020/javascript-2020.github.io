


<chat-prompt>

      <template shadowrootmode=open>
      
            <style>
            
  :host
    {padding:10px;border:1px solid lightgray;border-radius:6px}
    
  #prompt
    {min-height:30px;outline:none}
    
            </style>
            
            <div id=prompt contenteditable>
            </div>
            
      </template>
      
      <script>
      
(function({mod,host}){

  var obj   = {};
  
        var df=true,did='prompt';
        
        var $,debug
        ;
        
        obj.initmod   = function(...list){
        
              list.forEach(params=>{
              
                    $   = mod.rd(params,'$',$);
                    debug   = mod.rd(params,'debug',debug);
                    
              });
              
        }//initmod
        
        
  //vars:
  
  
        var shadow;
        
        var prompt;
        
        
  //:
  
  
        obj.init    = async function(){
                                                                                debug=eval(debug.mod);
                                                                                debug('init');
        }//init
        
        
  //:
  
  
        obj.initdom   = async function(){
                                                                                debug('initdom');
              shadow                                    = host.shadowRoot;
              
              prompt                                    = $(shadow,'#prompt');
              prompt.onkeydown                          = kd;
              prompt.focus();
              
        }//initdom
        
        
        kd.mode   = 'single';
        
        function kd(e){
        
              if(e.key=='Enter'){
                    if(e.ctrlKey){
                          send();
                          e.preventDefault();
                    }
                    if(e.shiftKey){
                          kd.mode   = 'multi';
                    }
                    if(kd.mode=='multi')return;
                    send();
                    e.preventDefault();
              }
              
        }//kd
        
        
  //:
  
  
        obj.focus   = function(){
        
              prompt.focus();
              
        }//focus
        
        
        obj.clear   = function(){
        
              prompt.textContent    = '';
              
        }//clear
        
        
        obj.read    = function(){
        
              var txt   = prompt.textContent.trim();
              return txt;
              
        }//read
        
        
        
  return obj;
  
//prompt
})

</chat-prompt>
