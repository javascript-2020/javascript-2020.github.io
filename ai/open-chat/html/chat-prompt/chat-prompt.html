      <script>
      
(function({mod,host}){

  var obj   = {};
  
        var df=true,did='prompt';
        
        var $,debug,settings
        ;
        
        obj.initmod   = function(...list){
        
              list.forEach(params=>{
              
                    $             = mod.rd(params,'$',$);
                    debug         = mod.rd(params,'debug',debug);
                    settings      = mod.rd(params,'settings',settings);
                    
              });
              
        }//initmod
        
        
  //vars:
  
  
        var shadow;
        
        var prompt;
        
        
        var btn   = {};
        
        
  //:
  
  
        obj.init    = async function(){
                                                                                debug=eval(debug.mod);
                                                                                debug('init');
        }//init
        
        
  //:
  
  
        obj.initdom   = async function(){
                                                                                debug('initdom');
              shadow                                    = host.shadowRoot;
              
              $(shadow,'#settings').onclick             = btn.settings;
              
              prompt                                    = $(shadow,'#prompt');
              prompt.onkeydown                          = kd;
              prompt.focus();
              
        }//initdom
        
        
        kd.mode   = 'single';
        
        function kd(e){
        
              if(e.key=='Enter'){
                    if(e.ctrlKey){
                          send();
                          e.preventDefault();
                    }
                    if(e.shiftKey){
                          kd.mode   = 'multi';
                    }
                    if(kd.mode=='multi')return;
                    send();
                    e.preventDefault();
              }
              
        }//kd
        
        
        btn.settings    = function(){
        
              settings.toggle();
              
        }//settings
        
        
  //:
  
  
        obj.focus   = function(){
        
              prompt.focus();
              
        }//focus
        
        
        obj.clear   = function(){
        
              prompt.textContent    = '';
              
        }//clear
        
        
        obj.read    = function(){
        
              var txt   = prompt.textContent.trim();
              return txt;
              
        }//read
        
        
        
  return obj;
  
//prompt
})

      </script>
      
</chat-prompt>
