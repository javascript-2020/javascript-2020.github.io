      <script>
      
(function({mod,host}){

  var obj   = {
        version   : 'v1.0',
  };
  
        var df=true,did='chat-mod';
        
        var $,debug,list
        ;
        
        obj.initmod   = function(...list2){
        
              list2.forEach(params=>{
              
                    $       = mod.rd(params,'$',$);
                    debug   = mod.rd(params,'debug',debug);
                    list    = mod.rd(params,'list',list);
                    
              });
              
        }//initmod
        
        
  //vars:
  
  
        var shadow;
        
        var ui        = {};
        
        obj.scroll    = {};
        var create    = {};
        obj.create    = create;
        
        
  //:
  
  
        obj.init    = async function(){
        }//init
        
        
  //:
  
  
        obj.initdom   = async function(){
        
              shadow                                    = host.shadowRoot;
              
              ui.user                                   = $(shadow,'.user');
              ui.user.remove();
              
              ui.assistant                              = $(shadow,'.assistant');
              ui.assistant.remove();
              
        }//initdom
        
        
  //:
  
  
        obj.add   = function(v){
        
              shadow.append(v);
              
        }//add
        
        
        obj.scroll.bottom   = function(){
        
              host.scrollTop    = 999_999;
              
        }//bottom
        
        
  //:
  
  
        create.user   = function({txt}){
                                                                                //console.log(txt);
                                                                                
              var node                          = ui.user.cloneNode(true);
              
              node.onclick                      = click;
              node.onmouseenter                 = me;
              node.onmouseleave                 = ml;
              
              var icons                         = $(node,'.icons');
              
              //var html                          = md.render(txt);
              $(node,'.content').textContent    = txt;
              
              shhadow.append(node);
              host.scrollTop                 = 999_999;
              
              var id    = list.add.user({content:txt,node,status:true});
              
              return {id,node};
              
              
              function click(e){
              
                    if(e.target.classList.contains('consolidate')){
                    }
                    if(e.target.classList.contains('remove')){
                          var index   = list.findIndex(o=>o.id===id);
                          list.splice(index,1);
                          node.remove();
                    }
                    
              }//click
              
              
              function me(){
              
                    icons.style.display   = '';
                    
              }//me
              
              
              function ml(){
              
                    icons.style.display   = 'none';
                    
              }//ml
              
        }//user
        
        
        create.assistant    = function({}={}){
        
              var node                          = ui.assistant.cloneNode(true);
              
              node.onclick                      = click;
              node.onmouseenter                 = me;
              node.onmouseleave                 = ml;
              
              var icons                         = $(node,'.icons');
              shadow.append(node);
              host.scrollTop                    = 999_999;
              
              var id    = list.add.assistant({content:'',node,status:false});
              return {id,node};
              
              
              function click(e){
              
                    if(e.target.classList.contains('consolidate')){
                    }
                    if(e.target.classList.contains('remove')){
                          var index   = list.findIndex(o=>o.id===id);
                          list.splice(index,1);
                          node.remove();
                    }
                    
              }//click
              
              
              function me(){
              
                    icons.style.display   = '';
                    
              }//me
              
              
              function ml(){
              
                    icons.style.display   = 'none';
                    
              }//ml
              
        }//bot
        
        
  //:
  
  
  return obj;
  
//chat-mod
})

      </script>
      
</chat-mod>
