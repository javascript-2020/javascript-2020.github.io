        async function chat(prompt,node,{maxTokens=3072}={}){
        
              var txt               = system.textContent.trim();
              list[0].content       = txt;
              
              var server            = hdr.server.value;
              var endpoint          = server+'/v1/chat/completions';
              var messages          = list.messages();
                                                                                //console.json(messages);
                                                                                
              var headers           = {'content-type':'application/json'};
              var body              = JSON.stringify({
                                            messages          : messages,
                                            temperature       : 0.3,
                                            top_p             : 0.8,
                                            top_k             : 20,
                                            min_p             : 0.0,
                                            repeat_penalty    : 1.0,
                                            
                                            //max_tokens        : maxTokens,
                                            
                                            stream            : true,
                                            stream_options    : {include_usage:true}
                                      });
                                      
              var res               = await fetch(endpoint,{method:'POST',headers,body});
              
              var reader            = res.body.getReader();
              var decoder           = new TextDecoder('utf-8');
              
              var buffer            = '';
              var content           = '';
              var finishReason      = null;
              
              while(true){
              
                    var {value,done}    = await reader.read();
                    if(done)break;
                    
                    buffer     += decoder.decode(value,{stream:true});
                    
                    var lines   = buffer.split('\n');
                                                                                // Keep any incomplete trailing line in the buffer for the next chunk
                    buffer      = lines.pop();
                    
                    for(var line of lines){
                    
                          var trimmed   = line.trim();
                          if(!trimmed || !trimmed.startsWith('data: '))continue;
                                                                                //console.log(trimmed);
                                                                                // Strip 'data: '
                          var payload   = trimmed.slice(6);
                          if(payload==='[DONE]')break;
                          
                          var chunk     = JSON.parse(payload);
                          
                          if(chunk.usage){
                                                                                //console.log("Exact Prompt Tokens:", chunk.usage.prompt_tokens);
                                                                                //console.log("Exact Completion Tokens:", chunk.usage.completion_tokens);
                                hdr.total_tokens.textContent    = chunk.usage.total_tokens;
                          }
                          
                          var choice    = chunk.choices[0];
                          if(choice){
                                                                                // Capture why generation stopped ('stop' vs 'length')
                                if(choice.finish_reason){
                                      finishReason    = choice.finish_reason;
                                }
                                                                                // Extract the new token text (or reasoning_content if Qwen3 emits <think>)
                                var delta   = choice.delta?.content;
                                if(delta){
                                      content                          += delta;
                                      var html                          = md.render(content);
                                      $(node,'.content').innerHTML      = html;
                                      ui.chat.scrollTop                 = 999_999;
                                }
                          }
                          
                    }//for
                    
              }//while
                                                                                console.log(`[Finished] Reason: ${finishReason}`);
                                                                                //console.log(fullContent);
                                                                                // Save the assembled message back to history
              list.add.assistant({content,node});
              
              return {content,finishReason};
              
        }//chat
        
        
        
        
        
        async function consolidate(messages,keepRecent=2){
        
              if(messages.length<=keepRecent+2){
                                                                                // Nothing to compact
                    return messages;
              }
              
              var sys           = messages[0]?.role==="system" ? messages[0] : null;
              var bodyTurns     = systemMsg ? messages.slice(1) : messages;
              
              var olderTurns    = bodyTurns.slice(0,-keepRecent);
              var recentTurns   = bodyTurns.slice(-keepRecent);
              
              var transcript    = olderTurns.map(m=>{
              
                    var str   = typeof m.content=='string' ? m.content : JSON.stringify(m.content);
                    return m.role+':'+str;
                    
              });
              transcript    = transcript.join('\n\n');
              
              var header    = {'content-type':'application/json'};
              var body      = JSON.stringify({
                    messages      : [
                                          {role:"system",content:"Compress the conversation into a factual state summary: decisions made, current code/artifacts, tool results, and open tasks. Omit filler."},
                                          {role:"user",content:transcript }
                                    ],
                    temperature   : 0.1,
                    max_tokens    : 512,
                    stream        : false,
                    
                    model         : activeModelId,
                    
              });
              
              var res       = await fetch(endpoint,{method:'post',headers,body});
              var data      = await res.json();
              var summary   = data.choices[0].message.content;
              
              return [
                    ...(systemMsg ? [systemMsg] : []),
                    { role: "user", content: `[Consolidated prior context]\n${summary}` },
                    { role: "assistant", content: "Understood. Continuing from the consolidated state." },
                    ...recentTurns
              ];
              
        }//consolidate

              $('#hdr #tokens #max').textContent    = max;
              
              return data;
              
        }//props

                                                                                //console.log('activeModelId',activeModelId);
