        function ready2(){
                                                                                console.log('ready2');
              btn.download.complete   = async function(){
              
              
                    var owner       = 'javascript-2020';
                    var repo        = 'code';
                    var branch      = 'main';
                    var path        = 'nodejs/servers/file-server/file-server.js';
                    
                    try{
                    
                          var res   = await fetch(`https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${path}`);
                          
                    }//try
                    catch(err){
                                                                                console.error(err);
                          log.red.pin('error downloading file');
                          log.red.pin(err.message);
                          return;
                          
                    }//catch
                    if(!res.ok){
                          var txt   = await res.text();
                                                                                console.error(txt);
                          log.red.pin('error downloading file');
                          log.red.pin(txt);
                          return;
                    }
                    
                    var blob      = await res.blob();
                    
                    var url       = window.URL.createObjectURL(blob);
                    
                    var a         = document.createElement('a');
                    a.href        = url;
                    a.download    = 'file-server.js';
                    a.click();
                    
              }//complete
              
        }//ready2
        
        
            </script>
